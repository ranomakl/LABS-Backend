   &lt;span style=&quot;background-color: rgb(255,255,255);&quot;&gt;ja das habe ich auch eingestellt gehabt. Das einzige was ich noch geändert habe das ich die Übertragungsart auf ASCII gestellt habe.. folgendes habe ich mit meinen Kollegen notiert:
    &lt;br clear=&quot;none&quot;&gt;

   &lt;div style=&quot;font-family: verdana;font-size: 12.0px;color: rgb(0,0,0);&quot;&gt;
    Der Liquiline antwortet ueber Modbus RS485 auf gar nichts. Ueber einen ganzen Tag hinweg
    &lt;br clear=&quot;none&quot;&gt;
    wurden weit ueber tausend Leseanfragen (Funktionscode 03) geschickt, es kam nie ein einziger
    &lt;br clear=&quot;none&quot;&gt;
    Antwortrahmen zurueck. Die COM-LED am Modul 485 hat dabei nie geblinkt.
    &lt;br clear=&quot;none&quot;&gt;
    Messung und Display am Geraet funktionieren einwandfrei.
   &lt;/div&gt;
   &lt;div style=&quot;font-family: verdana;font-size: 12.0px;color: rgb(0,0,0);&quot;&gt;
    &lt;br clear=&quot;none&quot;&gt;
    GERAETEEINSTELLUNGEN (am Menue abgelesen)
   &lt;/div&gt;
   &lt;div style=&quot;font-family: verdana;font-size: 12.0px;color: rgb(0,0,0);&quot;&gt;
    - Setup/General settings/Extended setup/Modbus: Modus ASCII, Adresse 247, 19200 Baud,
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; Paritaet gerade (E), Watchdog 5 s.
    &lt;br clear=&quot;none&quot;&gt;
    - Laut Handbuch SD01189C (Register 504 RS485_ENABLE) ist Modbus RS485 ab Werk eingeschaltet.
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; Im Menue gibt es keinen Ein/Aus-Punkt dafuer.
    &lt;br clear=&quot;none&quot;&gt;
    - Diagnoseliste: nur F100 &quot;Sensor Kommunikation CH2&quot; (Sensor war zwischenzeitlich abgesteckt,
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; eigenes Thema). KEIN S969 Modbus-Watchdog-Fehler, obwohl der Watchdog auf 5 s steht und
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; nie eine Anfrage ankommt. Das ist auffaellig.
   &lt;/div&gt;
   &lt;div style=&quot;font-family: verdana;font-size: 12.0px;color: rgb(0,0,0);&quot;&gt;
    &lt;br clear=&quot;none&quot;&gt;
    WAS WIR AUF UNSERER SEITE AUSGESCHLOSSEN HABEN
   &lt;/div&gt;
   &lt;div style=&quot;font-family: verdana;font-size: 12.0px;color: rgb(0,0,0);&quot;&gt;
    - Protokollparameter: ASCII und RTU, 1200 bis 115200 Baud, Paritaet E/N/O, Adressen 1 und
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; 247. Bei 19200/E zusaetzlich alle Adressen 1 bis 247 (falls ein DIP-Schalter am Modul
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; Vorrang vor der Menue-Adresse hat).
    &lt;br clear=&quot;none&quot;&gt;
    - Verkabelung laut KA01159C Abschnitt 5.4.2: Klemme 95 = B (Data+), 96 = A (Data-),
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; 99 = C (DGND). GND war anfangs nicht angeklemmt, wurde nachgeholt - keine Aenderung.
    &lt;br clear=&quot;none&quot;&gt;
    - A/B zweimal getauscht. Mit vertauschter Polung kommt nach jeder Anfrage genau ein Byte 00
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; zurueck (Leitung kippt in den Ruhezustand), die Leitung ist also elektrisch verbunden.
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; Mit richtiger Polung kommt gar nichts.
    &lt;br clear=&quot;none&quot;&gt;
    - Terminierung am Modul eingeschaltet (T-LED gelb) - keine Aenderung.
    &lt;br clear=&quot;none&quot;&gt;
    - Zwei verschiedene USB-RS485-Adapter (FTDI BG02Q3TM und BG01XFU4), beide senden
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; nachweislich (TXD-LED blinkt). Beide ohne Antwort.
    &lt;br clear=&quot;none&quot;&gt;
    - Geraet neu gestartet - keine Aenderung.
    &lt;br clear=&quot;none&quot;&gt;
    - 07.10.2026 wiederholt (Adapter BG01XFU4): voller Scan plus Dauertests mit den am Geraet
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; eingestellten Werten (ASCII, 19200, E, Adresse 247), zusaetzlich RTU und Adresse 1:
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; ueber 300 Anfragen, kein einziges Byte zurueck. Passiv gelauscht: Leitung ist ruhig,
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; keine Stoerung. Befund identisch zum 30.09.
    &lt;br clear=&quot;none&quot;&gt;
    - Modul-LEDs: PWR gruen, T gelb, COM nie. SF rot kam nur vom fehlenden Sensor an Kanal 2
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; und ging nach Anstecken wieder weg.
   &lt;/div&gt;
   &lt;div style=&quot;font-family: verdana;font-size: 12.0px;color: rgb(0,0,0);&quot;&gt;
    &lt;br clear=&quot;none&quot;&gt;
    FRAGEN AN E+H
   &lt;/div&gt;
   &lt;div style=&quot;font-family: verdana;font-size: 12.0px;color: rgb(0,0,0);&quot;&gt;

    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; &amp;nbsp;auf Modbus TCP/Ethernet konfiguriert? Welcher Feldbus ist aktiv?
    &lt;br clear=&quot;none&quot;&gt;
    2. Warum meldet das Geraet keinen S969 Watchdog-Fehler, obwohl nie eine Modbus-Anfrage
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; &amp;nbsp;ankommt? Deutet das darauf hin, dass die Modbus-Schnittstelle gar nicht aktiv laeuft?
    &lt;br clear=&quot;none&quot;&gt;
    3. Gibt es ausser dem Menuepunkt Setup/General settings/Extended setup/Modbus noch eine
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; &amp;nbsp;Freischaltung oder einen Aktivierungscode?
    &lt;br clear=&quot;none&quot;&gt;
    4. Hat das Modul 485 einen Hardware-Adressschalter, der das Menue ueberstimmt, und wo sitzt er?
    &lt;br clear=&quot;none&quot;&gt;
    5. Kann das Modul 485 defekt sein, wenn PWR gruen leuchtet, aber COM bei eingehenden
    &lt;br clear=&quot;none&quot;&gt;
    &amp;nbsp; &amp;nbsp;Anfragen nie reagiert?
