# config.messstand2.yml — Konfiguration fuer Messstand II (zweiter Pi, angelegt 02.11.2026).
#
# Der Code ist fuer alle Messstaende derselbe, diese Datei ist stationsspezifisch
# (docs/pi_einrichtung_checkliste.md, Abschnitt 4). config.yml gehoert Messstand I und bleibt unberuehrt.
# Welche Datei ein Pi laedt, steht in station.conf (nicht im Repo, pro Pi), siehe tools/labs_start.sh.
#
# STAND 04.11.2026: valve1 (Knauer-Ventil) und pump1 (Longer BT100-1F) laufen, beide am Geraet getestet.
# liquiline (E+H CM44x) antwortet seit 04.11. 14:20 per Modbus RTU; Sensoren am Geraet noch nicht auf AI zugeordnet.
# 06.11.2026: Zugabe ueber das Ventil (dosing: bei pump1, Routinen zugabe/spuelen/dosiertest) - am PC gegen die
# Dummys getestet, am Geraet noch NICHT gelaufen. Testreihenfolge: docs/messstand2_zugabe_06-11-2026.md.
# Naechste Schritte:
#   1. Geraeteliste (Hersteller, Modell, Schnittstelle) klaeren und hier unter devices: eintragen.
#   2. Adapter einzeln stecken, Pfade auslesen (ls -l /dev/serial/by-id/ bzw. /dev/serial/by-path/),
#      als address eintragen und als Kommentar notieren: Seriennummer, Etikett, Geraet, Hub-Buchse.
#   3. Pro Geraet eine Leseroutine und eine Schaltroutine mit Stop-Routine (test_...) unter experiments:.
#   4. Erst dann die Versuchsschritte. Vorlagen: config.yml (Messstand I), docs/routinen_uebersicht.md.

listen port: 11123
destination port: 32111
log_level: info
# Schrittmodus: true = nach jedem fertigen Experiment anhalten, naechster Schritt erst mit "Start Experiments".
# Wie am Messstand I seit 16.10.2026 eingeschaltet.
step_mode: true

devices:

  valve1:
    driver: knauer_azura_vu_4_1
    # Knauer AZURA Valve Unifier VU 4.1, SN FVH263200018, Firmware 6.26.000.0000.
    # Ventilkopf SN FWM263200013, Typ EVS63CE, 16 Positionen / 16 Ports (am 02.11.2026 abgefragt).
    # LAN direkt an eth0 des Pi. eth0 steht in NetworkManager auf "shared" (Pi verteilt per DHCP
    # 10.42.0.x), das Ventil bekommt seine Adresse per DHCP (MAC 00:15:e2:00:78:e2).
    # Port 10001 = Knauer-Werkseinstellung (die alten Ventile in config.yml.bak liefen auf 10123).
    # Nach dem Einschalten braucht das Ventil eine Weile, bis Port 10001 offen ist.
    # ACHTUNG: Der Treiber faehrt beim Backend-Start auf Position 1 (initial_commands).
    address: 10.42.0.103:10001

  # Longer BT100-1F Schlauchpumpe, SN 202606090001, RS485 ueber FTDI-Adapter BG01X3TF (LogiLink-Hub).
  # Protokoll: docs/BT100-1F-RS485-Protocol.pdf (04.11.2026), Kurzfassung docs/protokoll_bt100_1f.md.
  # Am Geraet: System Setting -> Ext Cont. ON, Address 1 (am 02.11.2026 gesetzt). 1200 Baud 8E1 im Treiber.
  # Sollwert ist eine Flussrate in mL/min; die Pumpe rechnet selbst anhand von Kopf/Schlauch (RT liest das aus).
  # ACHTUNG: Der Treiber stoppt die Pumpe beim Backend-Start und am Ende jedes Experiments (final_commands).
  # AM GERAET VERIFIZIERT 04.11.2026: test_pump1_read und test_pump1_flow (5 mL/min, 0,5 min) laufen; die Pumpe
  # meldet Kopf DG 6 Rollen, Schlauch Nr. 5 (1,65 mm) -> Bereich laut Handbuch 0,018-18 mL/min.
  pump1:
    driver: longer_bt100_1f
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01X3TF-if00-port0
    pump_address: 1
    # Zugabe ueber das Auswahlventil (06.11.2026, backend/drivers/valve_dosing.py, docs/messstand2_zugabe_06-11-2026.md).
    # Aufbau: Vorratsgefaesse an den Ventil-Ports -> valve1 -> Schlauch -> pump1 -> Reaktor.
    # Die Pumpe stellt das Ventil selbst; jede Zugabe wird mit Wasser nachgespuelt. ALLE Werte sind Pflicht.
    dosing:
      valve: valve1
      water_port: 1            # Wasser gehoert an Port 1: dorthin faehrt das Ventil beim Backend-Start
      dead_volume_ml: 1.0      # 24.11.2026 Rafael: 1,0 mL (nach 20 cm 1,6-ID-Schlauch entfernt erst 0,9, dann auf 1,0 hochgesetzt). Spuelmenge = 1,5 x = 1,5 mL. Vorher 1,25 (23.11.), 2,0 (11.11.), 1,5, 1,85
      flush_factor: 1.5        # Spuelmenge = 1,5 x Totvolumen (Anforderung: 1- bis 2-fach)
      min_rate_ml_min: 0.0058  # 19.11.2026 Rafael: Schlauch jetzt 1,02 x 0,86 mm, Kopf DG 6 Rollen. Handbuch S. 4:
      max_rate_ml_min: 5.8     #   5,8 uL/min bis 5,8 mL/min (Longer empfiehlt 20-80 % davon = 1,2-4,6 mL/min).
                               #   Schlauch-ID 1.02 ist AM GERAET eingestellt (System Setting > Pump head & Tube) -
                               #   LABS schickt nur mL/min, die Umrechnung macht die Pumpe. Vorher 1,65 mm: 0,018-18, getestet bis 5.
      min_dose_seconds: 10     # kleine Volumen so langsam, dass die Pumpe mindestens 10 s laeuft
      clockwise: false         # 19.11.2026 Rafael: Dosierpumpe dreht bei allen Zugaben ueber das Ventil nach LINKS
                               # (vorfuellen, ansatz, ph_regelung, zugabe, spuelen). true = im Uhrzeigersinn.
      ph_device: liquiline     # pH fuer die Regelung (ph_regelung, ansatz) kommt von der Liquiline (Kanal ph = AI 1)
      ph_observable: ph_value
      # Flaschen der pH-Regelung, fest verdrahtet (Rafael 11.11.2026) - NICHT im Frontend. 0 = Flasche nicht da,
      # dann nimmt die Regelung die andere Staerke derselben Richtung. Base hebt den pH, Saeure senkt ihn.
      # Angesteckt am 11.11.2026 (Rafael): 1 Wasser, 2 Saeure schwach, 3 Base schwach, 4 Base stark, 5 Saeure stark,
      # 6 Carbonsaeure, 7 Leitsalz (6 und 7 sind die festen Zugaben in ansatz, dort als Port eingeben).
      ph_ports:
        saeure_schwach: 2
        base_schwach: 3
        base_stark: 4
        saeure_stark: 5
      # Feste Zugaben des Ansatzes (Routine ansatz), ebenfalls fest - im Frontend nur Volumina.
      ansatz_ports:
        carbonsaeure: 6
        leitsalz: 7

  # Endress+Hauser Liquiline CM44x (zweites Geraet, Messstand II), Modbus RTU ueber FTDI-Adapter BG02Q3TM.
  # AM GERAET VERIFIZIERT 04.11.2026 14:20: antwortet bei 19200 Baud, 8E1, Adresse 247, Modus RTU
  # (Register 505 = 0), Byte order 1-0-3-2 (Register 506/507 Watchdog = 5,0 s). Klemmen am Modul 485MB:
  # 95 = B (Data+), 96 = A (Data-), 99 = GND. Die COM-LED am Modul blinkt NUR bei gueltigen Rahmen im
  # eingestellten Modus - eine dunkle COM-LED heisst also nicht "Kabel falsch", sondern meist "Menue falsch"
  # (Setup/General settings/Extended setup/Modbus: RTU, 19200, Even, Adresse 247).
  # 04.11.2026: alle 16 AI-Bloecke "Not assigned" -> am Geraet unter Setup/Outputs/Modbus/AI 1..16 je
  # Datenquelle (Sensorkanal) UND Messwert zuordnen, dann hier unter channels: eintragen (Register = 4*(n-1)).
  liquiline:
    driver: endress_hauser_liquiline
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG02Q3TM-if00-port0
    bus_address: 247
    byte_order: "1-0-3-2"
    channels:                   # Kanalname: Register (0-basiert = Beginn des AI-Blocks Value/Status/Unit)
      # pH-Elektrode auf AI 1 (Entscheidung 06.11.2026; am Geraet unter Setup/Outputs/Modbus/AI 1 zuordnen).
      # Solange dort nichts zugeordnet ist, liefert das Geraet ph_status "Not assigned" und ph_value 0.0 -
      # die Routinen laufen trotzdem, nur ohne brauchbaren pH.
      ph: 0

  # ---- Gashandling (Vorgabe 16.-20.11.2026; am 19.11. zuerst in config.yml/Messstand I gebaut, am 25.11.2026 hierher
  # umgezogen - docs/gashandling_19-11-2026.txt, Abschnitt 7) -------------------------------------------------------
  mfc2:                        # Bronkhorst "2" (Etikett), bisher mfc2 an Messstand I - seit 25.11.2026 hier (Rafael).
    driver: bronkhorst_mfc     # Am 25.11.2026 am Pi 2 lesend bestaetigt (tools/lese_mfc.py): Seriennummer M18212352C,
                               # Capacity 50 mln/min N2, Knoten 03, 38400 Baud, Sollwert stand auf 32000 = ganz auf.
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01B1W6-if00-port0   # ttyUSB2 am 25.11.
    node: "03"                 # FLOW-BUS-Knotenadresse, zwei Hex-Zeichen
    max_flow_ml_min: 50.0      # Typenschild / Capacity100% vom Geraet
    serial_parameters:
      baudrate: 38400          # am Geraet verifiziert (bei 187500 antwortet es nicht)
  # Relaisplatine an Messstand II (Pinbelegung docs/gashandling_19-11-2026.txt, 25.11.2026): ANDERE Platine als an
  # Messstand I, Schaltmechanismus laut Rafael gleich (Low-Active: Pin auf Masse = Relais an -> inverted: true),
  # aber OHNE das 5-V-Problem der alten Platine - darum kein release_when_off, "aus" = Pin High wie normal.
  # Beim ersten Test pruefen: Relais klickt bei Position B, faellt bei A ab. Pins: GPIO 17 (Pin 11) Low-Flow-Pumpe,
  # GPIO 27 (Pin 13) Gashandler = Relaismodul 1, GPIO 22 (Pin 15) Ventil Waste/Phasentrenner = Relaismodul 2;
  # frei: GPIO 23 (Pin 16, Modul 3), GPIO 24 (Pin 18, Modul 4). Nur bei ausgeschaltetem Pi stecken.
  gashandler:
    driver: raspi_gpio_relay_valve
    address: "GPIO27"
    pin: 27                  # BCM 27 = Header-Pin 13 = Relaismodul 1
    inverted: true           # Low-Active wie der Gasswitcher an Messstand I (Rafael 25.11.2026)
    safe_state: "A"            # A = Messweg (Relais aus, spannungslos), B = Spuelweg (ANNAHME 19.11., im Labor pruefen)
  lowflow_pumpe:               # Low-Flow-Pumpe, nur an/aus ueber GPIO 17 (kein Protokoll, keine Rate)
    driver: raspi_gpio_relay_valve
    address: "GPIO17"
    pin: 17                  # BCM 17 = Header-Pin 11
    inverted: false          # ANDERS als die Relaismodule: Pin 17 las am 25.11. LOW bei ausgeschalteter Pumpe
                             # (22/27 lesen High). Also Low = aus, High = an -> nicht invertiert. Mit inverted: true
                             # wuerde der sichere Zustand A den Pin auf High treiben = Pumpe laeuft ab Backend-Start.
                             # Beim ersten Test pruefen: Pumpe laeuft nur waehrend gas_spuelung (Position B).
    safe_state: "A"            # A = Pumpe aus (Pin Low), B = Pumpe an (Pin High). Routinenende/Stop/Start -> aus.
  ventil_waste:                # Ventil Waste vs. Phasentrenner (Relaismodul 2); noch in keiner Routine (25.11.2026)
    driver: raspi_gpio_relay_valve
    address: "GPIO22"
    pin: 22                  # BCM 22 = Header-Pin 15
    inverted: true
    safe_state: "A"            # A = Relais aus = spannungslose Stellung. ANNAHME 25.11.: A = Waste, B = Phasentrenner -
                               # im Labor pruefen, welche Stellung das stromlose Ventil hat, und hier eintragen.
  microgc:
    driver: inficon_microgc_fusion
    enabled: false             # 25.11.2026: derselbe microGC wie an Messstand I (Rafael). Er hat die Link-Local-Adresse
                               # 169.254.1.1 (kein DHCP). eth0 an Pi 2 ist "shared" (10.42.0.1/24, Knauer-Ventil
                               # 10.42.0.103): fuer den GC braucht eth0 zusaetzlich eine 169.254.x.y-Adresse, und
                               # Ventil + GC haengen ueber einen Switch an eth0. Sobald `ping 169.254.1.1` geht:
                               # diese Zeile entfernen.
    address: 169.254.1.1
    connect_timeout: 5.0        # TCP-Verbindungsaufbau-Timeout in s
    command_parameters:
      timeout: 10.0             # Antwort-Timeout pro Anfrage in s
    # Kein streams-Block: an Messstand II misst der GC einen Gasstrom (Messweg des Gashandlers), keine Zellenventile.

  # Vorlage (Beispiele aus config.yml, Messstand I; Adressen hier NICHT uebernehmen):
  #
  # FTDI-Adapter mit Seriennummer -> by-id (USB-Buchse egal):
  # mfc1:
  #   driver: bronkhorst_mfc
  #   address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_<SN>-if00-port0
  #   node: "03"
  #   max_flow_ml_min: 50.0
  #   serial_parameters:
  #     baudrate: 38400
  #
  # Adapter OHNE Seriennummer (CH340, Joy-IT-Netzteil) -> by-path (immer dieselbe Buchse, beschriften):
  # psu1:
  #   driver: joyit_dpm86
  #   address: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:<buchse>:1.0-port0
  #   dpm_address: "01"
  #   voltage_limit: 48.0
  #   current_limit: 5.0
  #
  # GPIO-Relais (Relaisplatine an eigene 5 V, nicht an 3,3 V des Pi):
  # ventil_z1:
  #   driver: raspi_gpio_relay_valve
  #   address: "GPIO17"
  #   release_when_off: true
  #
  # Geraet voruebergehend abschalten, ohne es zu loeschen:  enabled: false

experiments:

  # Ventil auf eine Position (1-16) fahren. Der Treiber liest die Position danach zurueck.
  test_valve1_position:
    conditions:
    stopconditions:
    parameters:
      position: [float, ""]
    observables:
      - [valve1, position, str, ""]
    commands:
      - [valve1, set_position, ["{position}"], {}]

  # Pumpe nur LESEN (Flussrate, Zustand, Kopf/Schlauch) - erster Test an der Pumpe, bewegt nichts.
  test_pump1_read:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [pump1, set_flow_ml_min, float, mL/min]
      - [pump1, running, bool, ""]
      - [pump1, pump_head, str, ""]
      - [pump1, tubing_no, int, ""]
    commands:
      - [pump1, read_tubing, [], {}]
      - [pump1, read_flow, [], {}]

  # Pumpe 'minutes' Minuten mit 'rate' mL/min laufen lassen (negativ = gegen den Uhrzeigersinn), dann Stopp.
  # Live: eingestellte und tatsaechliche Flussrate (0 im Stand), Laufzustand.
  test_pump1_flow:
    conditions:
    stopconditions:
    parameters:
      rate: [float, mL/min]
      minutes: [float, min]
    observables:
      - [pump1, set_flow_ml_min, float, mL/min]
      - [pump1, flow_ml_min, float, mL/min]
      - [pump1, running, bool, ""]
    commands:
      - [pump1, run_for_minutes, [], { rate: "{rate}", minutes: "{minutes}" }]

  # Not-Stopp von Hand (das Experimentende stoppt die Pumpe ohnehin).
  test_pump1_stop:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [pump1, running, bool, ""]
    commands:
      - [pump1, stop_pumping, [], {}]
      - [pump1, read_flow, [], {}]

  # Liquiline: alle 16 Modbus-Bloecke AI1-AI16 einmal lesen (Status Good/Bad/Not assigned, Einheit, Wert),
  # unabhaengig von liquiline/channels - zeigt, auf welchen Bloecken das Geraet Sensoren ausgibt.
  test_liquiline_scan:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [liquiline, ai1_status, str, ""]
      - [liquiline, ai1_unit, str, ""]
      - [liquiline, ai1_value, float, ""]
      - [liquiline, ai2_status, str, ""]
      - [liquiline, ai2_unit, str, ""]
      - [liquiline, ai2_value, float, ""]
      - [liquiline, ai3_status, str, ""]
      - [liquiline, ai3_unit, str, ""]
      - [liquiline, ai3_value, float, ""]
      - [liquiline, ai4_status, str, ""]
      - [liquiline, ai4_unit, str, ""]
      - [liquiline, ai4_value, float, ""]
      - [liquiline, ai5_status, str, ""]
      - [liquiline, ai5_unit, str, ""]
      - [liquiline, ai5_value, float, ""]
      - [liquiline, ai6_status, str, ""]
      - [liquiline, ai6_unit, str, ""]
      - [liquiline, ai6_value, float, ""]
      - [liquiline, ai7_status, str, ""]
      - [liquiline, ai7_unit, str, ""]
      - [liquiline, ai7_value, float, ""]
      - [liquiline, ai8_status, str, ""]
      - [liquiline, ai8_unit, str, ""]
      - [liquiline, ai8_value, float, ""]
      - [liquiline, ai9_status, str, ""]
      - [liquiline, ai9_unit, str, ""]
      - [liquiline, ai9_value, float, ""]
      - [liquiline, ai10_status, str, ""]
      - [liquiline, ai10_unit, str, ""]
      - [liquiline, ai10_value, float, ""]
      - [liquiline, ai11_status, str, ""]
      - [liquiline, ai11_unit, str, ""]
      - [liquiline, ai11_value, float, ""]
      - [liquiline, ai12_status, str, ""]
      - [liquiline, ai12_unit, str, ""]
      - [liquiline, ai12_value, float, ""]
      - [liquiline, ai13_status, str, ""]
      - [liquiline, ai13_unit, str, ""]
      - [liquiline, ai13_value, float, ""]
      - [liquiline, ai14_status, str, ""]
      - [liquiline, ai14_unit, str, ""]
      - [liquiline, ai14_value, float, ""]
      - [liquiline, ai15_status, str, ""]
      - [liquiline, ai15_unit, str, ""]
      - [liquiline, ai15_value, float, ""]
      - [liquiline, ai16_status, str, ""]
      - [liquiline, ai16_unit, str, ""]
      - [liquiline, ai16_value, float, ""]
    commands:
      - [liquiline, scan_ai_blocks, [], { blocks: 16 }]

  # ---- Zugabe ueber das Auswahlventil (06.11.2026) - siehe dosing: bei pump1 ------------------------------
  # Die Pumpe ist das einzige kommandierte Geraet; das Ventil stellt sie selbst (steht darum nur unter
  # observables). Volumen in mL: 0.2 = 200 uL, 0.05 = 50 uL.

  # EINE Zugabe: Ventil auf 'port', 'volume' mL foerdern, Ventil auf Wasser, Spuelmenge nachschieben.
  # In den Reaktor laufen volume + Spuelmenge (dead_volume_ml x flush_factor). Port 1 = nur Wasser.
  zugabe:
    conditions:
    stopconditions:
    parameters:
      port: [float, ""]
      volume: [float, mL]
    observables:
      - [valve1, position, str, ""]
      - [pump1, dosing_step, str, ""]
      - [pump1, dosed_ml, float, mL]
      - [pump1, flushed_ml, float, mL]
      - [pump1, delivered_ml, float, mL]
      - [pump1, dosing_flow_ml_min, float, mL/min]
    commands:
      - [pump1, add_from_port, [], { port: "{port}", volume: "{volume}" }]

  # Nur Wasser: Schlauch fuellen, nach einem Abbruch spuelen, von Hand auffuellen.
  spuelen:
    conditions:
    stopconditions:
    parameters:
      volume: [float, mL]
    observables:
      - [valve1, position, str, ""]
      - [pump1, dosing_step, str, ""]
      - [pump1, flushed_ml, float, mL]
      - [pump1, dosing_flow_ml_min, float, mL/min]
    commands:
      - [pump1, pump_water, [], { volume: "{volume}" }]

  # Dosiergenauigkeit auswiegen: 'repeats' mal 'volume' mL Wasser, dazwischen 'pause' s (Becher auf der Waage).
  dosiertest:
    conditions:
    stopconditions:
    parameters:
      volume: [float, mL]
      repeats: [float, ""]
      pause_zugabe: [float, s]
    observables:
      - [valve1, position, str, ""]
      - [pump1, dosing_step, str, ""]
      - [pump1, flushed_ml, float, mL]
      - [pump1, dosing_flow_ml_min, float, mL/min]
    commands:
      - [pump1, pump_water, [], { volume: "{volume}", repeats: "{repeats}", pause_s: "{pause}" }]
  # ---- Ansatz: Reaktionsloesung ansetzen UND auf den Ziel-pH bringen (11.11.2026) -----------------------------
  # EINE Routine fuer den ganzen Ansatz, nur Volumina in mL (die Umrechnung aus Konzentrationen nach Blatt 2
  # der Exceltabelle ist noch offen und wird vorher von Hand gemacht). Alle Ports stehen fest in der Config
  # (dosing: ansatz_ports fuer Leitsalz und Carbonsaeure, dosing: ph_ports fuer NaOH und die Regelung).
  # Ablauf: Leitsalz (Port 7) -> Wasser -> Carbonsaeure (Port 6) -> NaOH (Port 4, starke Base) - feste Zugaben,
  #         Volumen 0 = entfaellt, dazwischen pause_zugabe s -> wartezeit_ph_messung s warten -> pH-Regelung wie
  #         ph_regelung -> mit Wasser auf zielvolumen auffuellen (0 = nicht auffuellen, keine Grenze), in zehn
  #         Portionen mit pH-Messung und Nachregeln dazwischen (Rafael 25.11.2026, siehe ph_regelung).
  # vol_naoh = aequimolare Menge 10 M NaOH zur Carbonsaeure, VON HAND gerechnet (Vorgabe: 1 M CA auf 100 mL
  #         Gesamtvolumen -> 10 mL 10 M NaOH).
  # Jede Chemikalien-Zugabe und jede Dose wird mit der Spuelmenge Wasser nachgespuelt (zaehlt zum Volumen).
  # VOR dem ersten Ventilschritt wird gerechnet: passen die festen Zugaben + Spuelwasser nicht ins Zielvolumen,
  # bewegt sich nichts, Lauf endet als Failed. Abbrueche in der Regelung: siehe ph_regelung.
  ansatz:
    conditions:
    stopconditions:
    parameters:
      vol_leitsalz: [float, mL]
      vol_wasser: [float, mL]
      vol_carbonsaeure: [float, mL]
      vol_naoh: [float, mL]
      ziel_ph: [float, pH]
      toleranz: [float, pH]
      vol_gross: [float, mL]
      vol_klein: [float, mL]
      wartezeit_ph_messung: [float, s]
      zielvolumen: [float, mL]
      pause_zugabe: [float, s]
    observables:
      - [liquiline, ph_value, float, pH]
      - [liquiline, ph_status, str, ""]
      - [pump1, ph_additions, int, ""]
      - [valve1, position, str, ""]
      - [pump1, dosing_addition, str, ""]
      - [pump1, dosing_step, str, ""]
      - [pump1, dosed_ml, float, mL]
      - [pump1, flushed_ml, float, mL]
      - [pump1, delivered_ml, float, mL]
      - [pump1, dosing_flow_ml_min, float, mL/min]
    commands:
      - [liquiline, start_measuring, [], { interval: 2.0 }]
      - [pump1, prepare_solution, [], { vol_leitsalz: "{vol_leitsalz}", vol_wasser: "{vol_wasser}", vol_carbonsaeure: "{vol_carbonsaeure}", vol_naoh: "{vol_naoh}", target_ph: "{ziel_ph}", tolerance: "{toleranz}", vol_gross: "{vol_gross}", vol_klein: "{vol_klein}", wait_s: "{wartezeit_ph_messung}", target_volume: "{zielvolumen}", pause_s: "{pause_zugabe}" }]

  # ---- Ansatz NEU: gleiche Routine, andere Reihenfolge der festen Zugaben (Rafael 23.11.2026) -------------------
  # Wie ansatz, nur: Carbonsaeure (Port 6) -> Leitsalz Na2SO4 (Port 7) -> Wasser -> NaOH (Port 4), dann wie oben
  # warten, pH-Regelung, Auffuellen. Die Reihenfolge steht im Feld order (Namen leitsalz, wasser, carbonsaeure,
  # je genau einmal); ansatz selbst bleibt bei Leitsalz -> Wasser -> Carbonsaeure.
  ansatz_neu:
    conditions:
    stopconditions:
    parameters:
      vol_carbonsaeure: [float, mL]
      vol_leitsalz: [float, mL]
      vol_wasser: [float, mL]
      vol_naoh: [float, mL]
      ziel_ph: [float, pH]
      toleranz: [float, pH]
      vol_gross: [float, mL]
      vol_klein: [float, mL]
      wartezeit_ph_messung: [float, s]
      zielvolumen: [float, mL]
      pause_zugabe: [float, s]
    observables:
      - [liquiline, ph_value, float, pH]
      - [liquiline, ph_status, str, ""]
      - [pump1, ph_additions, int, ""]
      - [valve1, position, str, ""]
      - [pump1, dosing_addition, str, ""]
      - [pump1, dosing_step, str, ""]
      - [pump1, dosed_ml, float, mL]
      - [pump1, flushed_ml, float, mL]
      - [pump1, delivered_ml, float, mL]
      - [pump1, dosing_flow_ml_min, float, mL/min]
    commands:
      - [liquiline, start_measuring, [], { interval: 2.0 }]
      - [pump1, prepare_solution, [], { order: "carbonsaeure,leitsalz,wasser", vol_leitsalz: "{vol_leitsalz}", vol_wasser: "{vol_wasser}", vol_carbonsaeure: "{vol_carbonsaeure}", vol_naoh: "{vol_naoh}", target_ph: "{ziel_ph}", tolerance: "{toleranz}", vol_gross: "{vol_gross}", vol_klein: "{vol_klein}", wait_s: "{wartezeit_ph_messung}", target_volume: "{zielvolumen}", pause_s: "{pause_zugabe}", title: "Ansatz neu" }]

  # ---- Schlaeuche fuellen vor dem ersten Ansatz (10.11.2026) -------------------------------------------------
  # Auslauf in ein Becherglas! Erst 'vol_wasser' mL Wasser (Wasserweg + Schlauch zum Reaktor luftfrei), dann je
  # Port 'vol_je_port' mL seiner Chemikalie (fuellt die Zuleitung Vorratsgefaess -> Ventil), jeweils mit Wasser
  # nachgespuelt - danach steht der Schlauch zum Reaktor wieder auf Wasser. Nicht genutzte Ports = 0.
  # Sechs Port-Felder (a..f) fuer alle Chemikalien-Ports 2..7 (Rafael 11.11.2026: auch 6 Carbonsaeure, 7 Leitsalz).
  # Richtwert: 2 mL je Port reichen fuer etwa 1 m Zuleitung (1,65 mm innen). Danach Auslauf in den Reaktor, ansatz.
  vorfuellen:
    conditions:
    stopconditions:
    parameters:
      vol_wasser: [float, mL]
      port_a: [float, ""]
      port_b: [float, ""]
      port_c: [float, ""]
      port_d: [float, ""]
      port_e: [float, ""]
      port_f: [float, ""]
      vol_je_port: [float, mL]
    observables:
      - [valve1, position, str, ""]
      - [pump1, dosing_addition, str, ""]
      - [pump1, dosing_step, str, ""]
      - [pump1, dosed_ml, float, mL]
      - [pump1, flushed_ml, float, mL]
      - [pump1, dosing_flow_ml_min, float, mL/min]
    commands:
      - [pump1, add_recipe, [], { additions: "Wasser={vol_wasser};{port_a}:{vol_je_port};{port_b}:{vol_je_port};{port_c}:{vol_je_port};{port_d}:{vol_je_port};{port_e}:{vol_je_port};{port_f}:{vol_je_port}", target_volume: 0, pause_s: 0, title: Vorfuellen }]

  # ---- pH-Regelung (11.11.2026, Vorgabe des Chemikers) --------------------------------------------------------
  # Nur die pH-Regelung plus Auffuellen, keine festen Zugaben. Flaschen fest aus dosing: ph_ports (nicht im
  # Frontend). Vier Schritte in fester Reihenfolge: 1 stark/vol_gross -> 2 stark/vol_klein -> 3 schwach/vol_gross
  # -> 4 schwach/vol_klein. Richtung nach dem aktuellen pH: unter dem Ziel Base (hebt), ueber dem Ziel Saeure
  # (senkt). Liegt der pH auf derselben Seite des Ziels wie vor der letzten Dose: Schritt bleibt. Seite
  # gewechselt (ueber-/unterschossen): naechster Schritt, nie zurueck. Im Schritt 4 halbiert jeder weitere
  # Seitenwechsel die Dose (vol_klein/2, /4, ...; Rafael 24.11.2026) statt zu pendeln. Aendert sich der pH nach
  # der ersten Dose aus der starken Base bzw. Saeure um weniger als 0,1, kommt einmalig die dreifache Dose
  # (Rafael 24.11.2026). Nach jeder Dose: Spuelen,
  # wartezeit_ph_messung s warten, wieder messen - bis ziel_ph +- toleranz. Dann mit Wasser auf zielvolumen
  # auffuellen (0 = nicht auffuellen, keine Grenze) - in zehn Portionen je 10 % der Auffuellmenge, nach jeder
  # Portion wartezeit_ph_messung s warten und messen; pH nicht mehr im Fenster -> weiterregeln mit dem Schritt
  # und der (halbierten) Dose von vorher, dann die naechste Portion (Rafael 25.11.2026: das Fuellwasser zog den
  # pH beim Lauf vom 25.11. von 9,8 auf 7,7). startvolumen = was schon im Gefaess ist.
  # Abbruch (Failed) mit Meldung: Zielvolumen voll (einzige fachliche Grenze, Rafael 11.11.), kein/veralteter pH-Wert,
  # Status nicht Good, mehr als 40 Dosen. Vorher Schlaeuche fuellen: Routine vorfuellen (Ports 2, 3, 4, 5).
  ph_regelung:
    conditions:
    stopconditions:
    parameters:
      ziel_ph: [float, pH]
      toleranz: [float, pH]
      vol_gross: [float, mL]
      vol_klein: [float, mL]
      wartezeit_ph_messung: [float, s]
      startvolumen: [float, mL]
      zielvolumen: [float, mL]
    observables:
      - [liquiline, ph_value, float, pH]
      - [liquiline, ph_status, str, ""]
      - [pump1, ph_additions, int, ""]
      - [pump1, dosing_addition, str, ""]
      - [pump1, dosing_step, str, ""]
      - [valve1, position, str, ""]
      - [pump1, dosed_ml, float, mL]
      - [pump1, flushed_ml, float, mL]
      - [pump1, delivered_ml, float, mL]
      - [pump1, dosing_flow_ml_min, float, mL/min]
    commands:
      - [liquiline, start_measuring, [], { interval: 2.0 }]
      - [pump1, regulate_ph, [], { target_ph: "{ziel_ph}", tolerance: "{toleranz}", vol_gross: "{vol_gross}", vol_klein: "{vol_klein}", wait_s: "{wartezeit_ph_messung}", target_volume: "{zielvolumen}", start_volume: "{startvolumen}" }]

  # Erst die Geraetetests (test_...), dann die Versuchsschritte. Geaenderte Routinen bekommen einen
  # neuen Namen (das Frontend aktualisiert eine einmal geladene Routine nicht).

  # ===========================================================================================
  # Gashandling (Vorgabe 16.-20.11.2026; am 25.11.2026 von Messstand I hierher umgezogen) - docs/gashandling_19-11-2026.txt
  # Ablauf im Labor: gas_spuelung -> gas_messweg -> gc_messung. Vorher in devices bei microgc die Zeile
  # `enabled: false` entfernen, sonst fehlt gc_messung im Frontend (Geraet nicht verbunden).
  # ===========================================================================================
  # Gas-Spuelung vor der Reaktion: Gashandler auf Spuelweg (B) und dort `minutes` lang halten, Bronkhorst Zaehler auf 0
  # und Setpoint `gasrate` (Vorgabe 50 mL/min, 10 min). Das "dann zu" der Vorgabe ist seit 25.11.2026 raus (Rafael:
  # der Bronkhorst darf offen bleiben): das Routinenende stellt ihn ohnehin ganz auf (Zaehlerbetrieb, final_commands
  # im Treiber - Gasweg darf nie versperrt bleiben) und den Gashandler auf A.
  # "Waehrenddessen Pumpe an" = die Low-Flow-Pumpe am Relais GPIO 17 (Pinbelegung 25.11.2026): hold_position B ueber
  # dieselben Minuten, das Routinenende schaltet sie aus. Keine Rate - das Relais kennt nur an/aus. (pump1, die
  # Dosierpumpe hinter dem 16-Wege-Ventil, laeuft NICHT mit.)
  gas_spuelung:
    conditions:
    stopconditions:
    parameters:
      gasrate: [float, mL/min]
      minutes: [float, min]
    observables:
      - [gashandler, position, str, ""]
      - [lowflow_pumpe, position, str, ""]
      - [mfc2, flow, float, mL/min]
      - [mfc2, counter, float, mLn]
      - [mfc2, setpoint, float, mL/min]
    commands:
      - [gashandler, hold_position, [], { position: B, minutes: "{minutes}" }]
      - [lowflow_pumpe, hold_position, [], { position: B, minutes: "{minutes}" }]
      - [mfc2, reset_counter, [], {}]
      - [mfc2, set_setpoint, [], { flow_ml_min: "{gasrate}" }]
      - [mfc2, measure_for_minutes, [], { minutes: "{minutes}" }]

  # Wege aendern fuer die Messung: Gashandler auf Messweg (A = Relais aus), Bronkhorst-Zaehler auf 0, Bronkhorst ganz
  # auf, Setpoint zur Kontrolle lesen (Observable setpoint muss den Vollausschlag zeigen). Keine Parameter.
  gas_messweg:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [gashandler, position, str, ""]
      - [mfc2, flow, float, mL/min]
      - [mfc2, counter, float, mLn]
      - [mfc2, setpoint, float, mL/min]
    commands:
      - [gashandler, set_position, [], { position: A }]
      - [mfc2, reset_counter, [], {}]
      - [mfc2, open_valve, [], {}]
      - [mfc2, read_setpoint, [], {}]

  # Eine GC-Messung von Hand (wie kolbe_gc_messung an Messstand I): Methode laden, Lauf mit Name/Tags starten,
  # danach die Daten des Laufs holen.
  gc_messung:
    conditions:
    stopconditions:
    parameters:
      method: [str, ""]
      name: [str, ""]
      tags: [str, ""]
    observables:
      - [microgc, system, str, ""]
    commands:
      - [microgc, load_method, [], { method_name: "{method}" }]
      - [microgc, run_method_named, [], { name: "{name}", tags: "{tags}" }]
      - [microgc, get_last_run_data, [], {}]
