# config.messstand2.yml — Konfiguration fuer Messstand II (zweiter Pi, angelegt 02.11.2026).
#
# Der Code ist fuer alle Messstaende derselbe, diese Datei ist stationsspezifisch
# (docs/pi_einrichtung_checkliste.md, Abschnitt 4). config.yml gehoert Messstand I und bleibt unberuehrt.
# Welche Datei ein Pi laedt, steht in station.conf (nicht im Repo, pro Pi), siehe tools/labs_start.sh.
#
# STAND 04.11.2026: valve1 (Knauer-Ventil) laeuft; pump1 (Longer BT100-1F) nach Protokoll eingetragen,
# aber noch enabled: false, bis der erste Test an der freien Pumpe gelaufen ist.
# Naechste Schritte:
#   1. Geraeteliste (Hersteller, Modell, Schnittstelle) klaeren und hier unter devices: eintragen.
#   2. Adapter einzeln stecken, Pfade auslesen (ls -l /dev/serial/by-id/ bzw. /dev/serial/by-path/),
#      als address eintragen und als Kommentar notieren: Seriennummer, Etikett, Geraet, Hub-Buchse.
#   3. Pro Geraet eine Leseroutine und eine Schaltroutine mit Stop-Routine (test_...) unter experiments:.
#   4. Erst dann die Versuchsschritte. Vorlagen: config.yml (Messstand I), docs/routinen_uebersicht.md.

listen port: 11123
destination port: 32111
log_level: info
# Schrittmodus: true = nach jedem fertigen Experiment anhalten, naechster Schritt erst mit "Start Experiments".
# Wie am Messstand I seit 16.10.2026 eingeschaltet.
step_mode: true

devices:

  valve1:
    driver: knauer_azura_vu_4_1
    # Knauer AZURA Valve Unifier VU 4.1, SN FVH263200018, Firmware 6.26.000.0000.
    # Ventilkopf SN FWM263200013, Typ EVS63CE, 16 Positionen / 16 Ports (am 02.11.2026 abgefragt).
    # LAN direkt an eth0 des Pi. eth0 steht in NetworkManager auf "shared" (Pi verteilt per DHCP
    # 10.42.0.x), das Ventil bekommt seine Adresse per DHCP (MAC 00:15:e2:00:78:e2).
    # Port 10001 = Knauer-Werkseinstellung (die alten Ventile in config.yml.bak liefen auf 10123).
    # Nach dem Einschalten braucht das Ventil eine Weile, bis Port 10001 offen ist.
    # ACHTUNG: Der Treiber faehrt beim Backend-Start auf Position 1 (initial_commands).
    address: 10.42.0.103:10001

  # Longer BT100-1F Schlauchpumpe, SN 202606090001, RS485 ueber FTDI-Adapter BG01X3TF (LogiLink-Hub).
  # Protokoll: docs/BT100-1F-RS485-Protocol.pdf (04.11.2026), Kurzfassung docs/protokoll_bt100_1f.md.
  # Am Geraet: System Setting -> Ext Cont. ON, Address 1 (am 02.11.2026 gesetzt). 1200 Baud 8E1 im Treiber.
  # Sollwert ist eine Flussrate in mL/min; die Pumpe rechnet selbst anhand von Kopf/Schlauch (RT liest das aus).
  # ACHTUNG: Der Treiber stoppt die Pumpe beim Backend-Start und am Ende jedes Experiments (final_commands).
  # STAND 04.11.2026: Treiber nach Protokoll geschrieben und mit den Herstellerbeispielen getestet, NOCH NICHT
  # an der Pumpe. enabled: false, bis test_pump1_read an der freien Pumpe gelaufen ist - dann auf true setzen.
  pump1:
    driver: longer_bt100_1f
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01X3TF-if00-port0
    pump_address: 1
    enabled: false

  # Vorlage (Beispiele aus config.yml, Messstand I; Adressen hier NICHT uebernehmen):
  #
  # FTDI-Adapter mit Seriennummer -> by-id (USB-Buchse egal):
  # mfc1:
  #   driver: bronkhorst_mfc
  #   address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_<SN>-if00-port0
  #   node: "03"
  #   max_flow_ml_min: 50.0
  #   serial_parameters:
  #     baudrate: 38400
  #
  # Adapter OHNE Seriennummer (CH340, Joy-IT-Netzteil) -> by-path (immer dieselbe Buchse, beschriften):
  # psu1:
  #   driver: joyit_dpm86
  #   address: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:<buchse>:1.0-port0
  #   dpm_address: "01"
  #   voltage_limit: 48.0
  #   current_limit: 5.0
  #
  # GPIO-Relais (Relaisplatine an eigene 5 V, nicht an 3,3 V des Pi):
  # ventil_z1:
  #   driver: raspi_gpio_relay_valve
  #   address: "GPIO17"
  #   release_when_off: true
  #
  # Geraet voruebergehend abschalten, ohne es zu loeschen:  enabled: false

experiments:

  # Ventil auf eine Position (1-16) fahren. Der Treiber liest die Position danach zurueck.
  test_valve1_position:
    conditions:
    stopconditions:
    parameters:
      position: [float, ""]
    observables:
      - [valve1, position, str, ""]
    commands:
      - [valve1, set_position, ["{position}"], {}]

  # Pumpe nur LESEN (Flussrate, Zustand, Kopf/Schlauch) - erster Test an der Pumpe, bewegt nichts.
  test_pump1_read:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [pump1, set_flow_ml_min, float, mL/min]
      - [pump1, running, bool, ""]
      - [pump1, pump_head, str, ""]
      - [pump1, tubing_no, int, ""]
    commands:
      - [pump1, read_tubing, [], {}]
      - [pump1, read_flow, [], {}]

  # Pumpe 'minutes' Minuten mit 'rate' mL/min laufen lassen (negativ = gegen den Uhrzeigersinn), dann Stopp.
  # Live: eingestellte und tatsaechliche Flussrate (0 im Stand), Laufzustand.
  test_pump1_flow:
    conditions:
    stopconditions:
    parameters:
      rate: [float, mL/min]
      minutes: [float, min]
    observables:
      - [pump1, set_flow_ml_min, float, mL/min]
      - [pump1, flow_ml_min, float, mL/min]
      - [pump1, running, bool, ""]
    commands:
      - [pump1, run_for_minutes, [], { rate: "{rate}", minutes: "{minutes}" }]

  # Not-Stopp von Hand (das Experimentende stoppt die Pumpe ohnehin).
  test_pump1_stop:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [pump1, running, bool, ""]
    commands:
      - [pump1, stop_pumping, [], {}]
      - [pump1, read_flow, [], {}]

  # Erst die Geraetetests (test_...), dann die Versuchsschritte. Geaenderte Routinen bekommen einen
  # neuen Namen (das Frontend aktualisiert eine einmal geladene Routine nicht).
