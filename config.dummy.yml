# config.dummy.yml — reduzierte Konfiguration ohne die Pumpen (eldex_optos: reagent_dosing_pump,
# electrolysis_pump), nmr (spinsolve_80) und foxy (foxy_r2), da LABS-DeviceDummys dafuer keine
# Simulation bereitstellt. Alle uebrigen Geraete zeigen auf 127.0.0.1:123xx (LABS-DeviceDummys).
# Ist die Quelle, aus der die aktive config.yml ueberschrieben wurde, um mit dem Simulator zu testen.

listen port: 11123
destination port: 32111
log_level: info

##### Valve positions #####

## reagent_valve ##
# 1: MeOH           Compressability: 6
# 2: MeOH+NH4Cl     Compressability: 6
# 3: Nitrobenzene   Compressability: 6
# 4: DMSO           Compressability: 6
# 5: SE             Compressability: 6
# 6: Reference      Compressability: 6
# 7: Acetonitrile   Compressability: 6

## electrolysis_loop_valve ##
# 1: reservoir
# 2: fraction_collector
# 3: waste
# 4: NMR

## pump_valve ##
# 1: electrolysis_pump
# 2: purge_pump

##### REDUCED CONFIG FOR LABS-DeviceDummys #####
# Only devices that have a simulated counterpart in ..\LABS-DeviceDummys are declared here.
# Not simulated / omitted: reagent_dosing_pump, electrolysis_pump (driver eldex_optos),
# nmr (spinsolve_80), foxy (foxy_r2) - LABS-DeviceDummys ships no dummy module for these.
# Start the dummy server first:
#   cd ..\LABS-DeviceDummys
#   python main.py

devices:

  reagent_valve:
    driver: knauer_azura_vu_4_1
    address: 127.0.0.1:12344

  electrolysis_loop_valve:
    driver: knauer_azura_vu_4_1
    address: 127.0.0.1:12345

  pump_valve:
    driver: knauer_azura_vu_4_1
    address: 127.0.0.1:12344   # shares the dummy instance with reagent_valve

  purge_pump:
    driver: ismatec_reglo_icc
    address: 127.0.0.1:12347
    channel: 4

  psu:
    driver: tdk_lambda_zplus
    address: 127.0.0.1:12346

  fractioncollector:
    driver: omnicoll
    address: 127.0.0.1:12349

  mfc:
    driver: bronkhorst_mfc
    address: 127.0.0.1:12351
    node: "03"                # muss zur Node-Adresse passen, die der Dummy zurueckechot (beliebig, Dummy ist node-agnostisch)
    max_flow_ml_min: 100.0    # Platzhalter, an echtes Geraet anpassen (Typenschild/Kalibrierschein)

  dosing_pump:
    driver: longer_wt600
    address: 127.0.0.1:12352   # LABS-DeviceDummys longer_wt600-Dummy
    pump_address: 1
    tubing: "3.2x6.4"
    tubing_table:
      3.2x6.4: 0.8883

  # 07.10.2026 aus config.yml hierher verschoben (Liquiline pausiert bis Antwort von E+H)
  microgc:
    driver: inficon_microgc_fusion
    address: 127.0.0.1:12354       # HTTP-Dummy (LABS-DeviceDummys/inficon_microgc_fusion.py)
    connect_timeout: 5.0
    command_parameters:
      timeout: 10.0

  liquiline:
    driver: endress_hauser_liquiline
    address: 127.0.0.1:12353
    bus_address: 1              # Modbus-Busadresse des Geraets (1-247, Werkseinstellung 247) - hier auf 1 gesetzt
    byte_order: "1-0-3-2"       # Geraeteparameter "Byte order", Werkseinstellung - muss zur echten Geraetekonfig passen
    channels:                   # Kanalname: Register (0-basiert, = Beginn des AI-Blocks Value/Status/Unit)
      ph_ch1: 0                 # AI1 (am echten Geraet: CH1 "1:1 pH Glas", pH)
      conductivity: 4                 # AI2 (CH2 "1:2 pH Glas", pH)
      temperature: 8            # AI3 (CH1, Temperatur)

#conditions:
  # Once a condition is True it will stay True inside the experiment.
  # Reusing conditions is only problematic when nesting experiments.
  # Strings in arguments and keyword arguments may hold variable parameters that are inserted
  # during the experiments initialization.
#  prerun_condition:
#    [DevicesWaitingCondition, [prerun_condition, [purge_pump]], {}]

experiments:
  # Experimentname:
  #   parameters:
  #     name as used in commands: [ accepted datatype (see below), unit (use "" if no unit) ]
  #     ...
  #   observables:
  #     - [ device, observable name, datatype (e. g. str or float), unit ]
  #     - ...
  #   commands:
  #     - [ device, function, [ args ], { kwargs } ]
  #     - other_experiment_inside_this_one
  #     - ...

  # ---- experiments kept from config.yml (only use devices declared above) ----

  empty_valve_reservoir_tube:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [1], {}]
      - [purge_pump, dispense, [], { rate: "15.0", volume: "10.0" }]

  empty_reservoir_filling_tube:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [1], {}]
      - [purge_pump, dispense, [], { rate: "15.0", volume: "20.0" }]

  empty_nmr_cell:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [4], {}]
      - [purge_pump, dispense, [], { rate: "15.0", volume: "25.0" }]

  collect_solution:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [2], {}]
      - [purge_pump, dispense, [], { rate: "-15.0", volume: "55.0" }]

  purge_reservoir_and_temper:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [3], {}]
      - [purge_pump, dispense, [], { rate: "-15.0", volume: "10.0" }]

  next_fraction:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [fractioncollector, next_fraction, [], {}]

  fc_test_1:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [fractioncollector, next_fraction, [], {}]
      - [fractioncollector, next_fraction, [], {}]
      - [fractioncollector, next_fraction, [], {}]

  large_cell_collect_solution:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [2], {}]
      - [purge_pump, dispense, [], { rate: "-15.0", volume: "320.0" }]

  # ---- new: exercise the simulated PSU directly (nothing in config.yml used psu without electrolysis_pump) ----

  test_psu_output:
    conditions:
    stopconditions:
    parameters:
      current: [float, A]
      max_voltage: [float, V]
    observables:
      - [psu, current, float, A]
      - [psu, voltage, float, V]
    commands:
      - [psu, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}" }]

  stop_psu_output:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [psu, stop_current, [], {}]

  # ---- new: exercise the simulated Bronkhorst MFC directly ----

  # Fehlerpfad-Test (08.10.2026, s. docs/test_fehlerpfad_dummys.md): Bronkhorst-Dummy zaehlt
  # 'minutes' Minuten; waehrenddessen wird der Dummy per STUMM-Datei zum Schweigen gebracht.
  test_fehlerpfad_mfc:
    conditions:
    stopconditions:
    parameters:
      minutes: [float, min]
    observables:
      - [mfc, flow, float, mL/min]
      - [mfc, counter, float, mLn]
    commands:
      - [mfc, reset_counter, [], {}]
      - [mfc, measure_for_minutes, [], { minutes: "{minutes}" }]

  # Fehlerpfad-Test mit ZWEI Geraeten: Pumpe laeuft, MFC wird stumm -> Pumpe muss trotzdem
  # gestoppt werden (final_commands), MFC bekommt den Abschaltbefehl (open_valve) trotz Error.
  test_fehlerpfad_mfc_pumpe:
    conditions:
    stopconditions:
    parameters:
      minutes: [float, min]
    observables:
      - [mfc, flow, float, mL/min]
      - [mfc, counter, float, mLn]
      - [dosing_pump, speed_rpm, int, rpm]
    commands:
      - [mfc, reset_counter, [], {}]
      - [mfc, start_measuring, [], { interval: 1.0 }]
      - [dosing_pump, run_for_minutes, [], { rate: 100, minutes: "{minutes}" }]

  demo_live_monitoring:
    conditions:
    stopconditions:
    parameters:
      flow: [float, mL/min]
      rate: [float, mL/min]
      volume: [float, mL]
    observables:
      - [mfc, flow, float, mL/min]
      - [mfc, counter, float, ""]
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
    commands:
      - [mfc, set_setpoint, [], { flow_ml_min: "{flow}" }]
      # KEIN stop_flow am Ende: dispense blockiert nur das Pumpen-Geraet, nicht die Befehlsliste -
      # ein nachfolgender stop_flow liefe sofort und setzte den Setpoint zurueck auf 0.
      # Das Aufraeumen (Setpoint 0, Pumpenstopp) erledigt das Experimentende selbst.
      - [dosing_pump, dispense, [], { rate: "{rate}", volume: "{volume}" }]

  test_wt600_speed:
    conditions:
    stopconditions:
    parameters:
      rpm: [float, rpm]
    observables:
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
    commands:
      - [dosing_pump, set_speed, [], { rpm: "{rpm}" }]
      - [dosing_pump, start_pumping, [], {}]
      - [dosing_pump, read_speed, [], {}]

  stop_wt600:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [dosing_pump, stop_pumping, [], {}]

  test_mfc_setpoint:
    conditions:
    stopconditions:
    parameters:
      flow: [float, mL/min]
    observables:
      - [mfc, flow, float, mL/min]
      - [mfc, counter, float, ""]
    commands:
      - [mfc, set_setpoint, [], { flow_ml_min: "{flow}" }]
      - [mfc, measure_flow, [], {}]

  test_mfc_counter:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [mfc, counter, float, ""]
    commands:
      - [mfc, read_counter, [], {}]

  stop_mfc:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [mfc, stop_flow, [], {}]

  # ---- new: exercise the simulated Endress+Hauser Liquiline CM44x directly ----

  test_liquiline_ph:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [liquiline, ph_ch1_value, float, pH]
      - [liquiline, ph_ch1_status, str, ""]
      - [liquiline, ph_ch1_unit, str, ""]
    commands:
      - [liquiline, read_channel, [], { channel: "ph_ch1" }]

  # Dauer-Messung wie in kolbe_elektrolyse_ph (config.yml): pH/Temperatur alle 2 s, solange die Pumpe laeuft.
  test_liquiline_messung:
    conditions:
    stopconditions:
    parameters:
      minutes: [float, min]
    observables:
      - [liquiline, ph_ch1_value, float, pH]
      - [liquiline, conductivity_value, float, mS/cm]
      - [liquiline, temperature_value, float, degC]
      - [liquiline, ph_ch1_status, str, ""]
      - [dosing_pump, speed_rpm, int, rpm]
    commands:
      - [liquiline, start_measuring, [], { interval: 2.0 }]
      - [dosing_pump, run_for_minutes, [], { rate: 100, minutes: "{minutes}" }]

  test_liquiline_all_channels:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [liquiline, ph_ch1_value, float, pH]
      - [liquiline, conductivity_value, float, mS/cm]
      - [liquiline, temperature_value, float, degC]
    commands:
      - [liquiline, read_all_channels, [], {}]

  # Dummy-Variante von kolbe_elektrolyse_ph (config.yml), damit das Experiment im Frontend mit den
  # Dummys durchgespielt werden kann (Aufgabenliste 12.10.2026, Punkt 3). Einziger Unterschied: der
  # TDK-Dummy-Treiber kennt kein "minutes" am Netzteil - der Ausgang geht hier erst mit den
  # Abschaltbefehlen am Experimentende aus (Pumpe laeuft "minutes", danach final_commands).
  kolbe_elektrolyse_ph:
    conditions:
    stopconditions:
    parameters:
      current: [float, A]
      max_voltage: [float, V]
      minutes: [float, min]
      rate: [float, mL/min]
    observables:
      - [psu, current, float, A]
      - [psu, voltage, float, V]
      - [psu, amount_of_charge, float, C]
      - [mfc, flow, float, mL/min]
      - [mfc, counter, float, mLn]
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
      - [liquiline, ph_ch1_value, float, pH]
      - [liquiline, conductivity_value, float, mS/cm]
      - [liquiline, temperature_value, float, degC]
      - [liquiline, ph_ch1_status, str, ""]
    commands:
      - [liquiline, start_measuring, [], { interval: 2.0 }]
      - [mfc, reset_counter, [], {}]
      - [mfc, start_measuring, [], { interval: 1.0 }]
      - [dosing_pump, run_for_minutes, [], { rate: "{rate}", minutes: "{minutes}" }]
      - [psu, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}" }]

  # 13.10.2026: GC-Messplan OHNE andere Geraete, zum Testen von run_schedule_named am Geraet.
  # gc_minutes: 0 = DAUERMESSUNG (naechster Lauf sobald das Geraet fertig ist, bis `minutes` um sind);
  #   eine Zahl N = alle N Minuten bis `minutes`; Liste mit SEMIKOLON "0;10;20" = feste Zeitpunkte
  #   (das Frontend macht aus Kommas Punkte). Je Lauf ~8 min. minutes = Dauer des Plans.
  # Laufname "<versuch>_<t> min", Tags "Test;LABS". Laufdaten zusaetzlich als JSON+CSV unter
  # logs/<J>/<M>/<T>/microgc/ (wie tools/kolbe_gc_messplan.py, tools/auswertung.py findet sie).
  test_microgc_plan:
    conditions:
    stopconditions:
    parameters:
      versuch: [str, ""]
      gc_minutes: [str, ""]
      minutes: [float, min]
    observables:
      - [microgc, system, str, ""]
      - [microgc, gc_schedule, str, ""]
      - [microgc, gc_runs_done, int, ""]
      - [microgc, gc_run_name, str, ""]
      - [microgc, gc_H2, float, "%"]
      - [microgc, gc_O2, float, "%"]
      - [microgc, gc_N2, float, "%"]
      - [microgc, gc_CO2, float, "%"]
      - [microgc, gc_Ethylene, float, "%"]
      - [microgc, gc_Ethane, float, "%"]
      - [microgc, gc_1_Penten, float, "%"]
      - [microgc, gc_n_Pentan, float, "%"]
      - [microgc, gc_n_Hexane, float, "%"]
      - [microgc, gc_n_Heptane, float, "%"]
    commands:
      - [microgc, run_schedule_named, [], { method_name: microGC_Standard_Method_calibrated_0726, prefix: "{versuch}", minutes: "{gc_minutes}", until_minutes: "{minutes}", tags: "Test;LABS" }]

  # 13.10.2026: kolbe_elektrolyse_ph PLUS microGC-Messplan im selben Experiment (statt
  # tools/kolbe_gc_messplan.py im zweiten Terminal). Der microGC startet zu jedem Zeitpunkt in
  # gc_minutes einen benannten Lauf "<versuch>_<t> min" mit Tags Kolbe;MP. gc_minutes: 0 = DAUERMESSUNG
  # (naechster Lauf sobald das Geraet fertig ist, bis `minutes` um sind, ~alle 8 min); Zahl N = alle N
  # Minuten; Liste mit SEMIKOLON "0;10;20;30;40;50;60;80;100;120;140;160;180;200;219" = Versuchsplan. Es
  # werden die Konzentrationen
  # meldet die Konzentrationen (gc_H2, gc_CO2, ... in %) als Observablen -> Kurven/Tabelle im
  # Monitoring, values.json, Bericht. Das Experiment endet erst, wenn der LETZTE GC-Lauf abgeholt ist
  # (letzter Zeitpunkt + ~8 min); Netzteil und Pumpe schalten unabhaengig davon nach `minutes` ab.
  # Neuer Name, weil das Frontend neue Parameter/Observablen nicht in geladene Routinen uebernimmt.
  kolbe_elektrolyse_gc:
    conditions:
    stopconditions:
    parameters:
      versuch: [str, ""]
      gc_minutes: [str, ""]
      current: [float, A]
      max_voltage: [float, V]
      minutes: [float, min]
      rate: [float, mL/min]
    observables:
      - [psu, current, float, A]
      - [psu, voltage, float, V]
      - [psu, amount_of_charge, float, C]
      - [mfc, flow, float, mL/min]
      - [mfc, counter, float, mLn]
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
      - [liquiline, ph_ch1_value, float, pH]
      - [liquiline, conductivity_value, float, mS/cm]
      - [liquiline, temperature_value, float, degC]
      - [liquiline, ph_ch1_status, str, ""]
      - [microgc, gc_schedule, str, ""]
      - [microgc, gc_runs_done, int, ""]
      - [microgc, gc_run_name, str, ""]
      - [microgc, gc_H2, float, "%"]
      - [microgc, gc_O2, float, "%"]
      - [microgc, gc_N2, float, "%"]
      - [microgc, gc_CO2, float, "%"]
      - [microgc, gc_Ethylene, float, "%"]
      - [microgc, gc_Ethane, float, "%"]
      - [microgc, gc_1_Penten, float, "%"]
      - [microgc, gc_n_Pentan, float, "%"]
      - [microgc, gc_n_Hexane, float, "%"]
      - [microgc, gc_n_Heptane, float, "%"]
    commands:
      - [liquiline, start_measuring, [], { interval: 2.0 }]
      - [mfc, reset_counter, [], {}]
      - [mfc, start_measuring, [], { interval: 1.0 }]
      - [dosing_pump, run_for_minutes, [], { rate: "{rate}", minutes: "{minutes}" }]
      - [psu, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}" }]
      - [microgc, run_schedule_named, [], { method_name: microGC_Standard_Method_calibrated_0726, prefix: "{versuch}", minutes: "{gc_minutes}", until_minutes: "{minutes}", tags: "Kolbe;MP" }]
