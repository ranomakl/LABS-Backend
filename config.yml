# config.yml — dies ist die Datei, die main.py tatsaechlich laedt.
#
# STAND 07.10.2026: Konfiguration fuer den Laborversuch am 08.10.2026 (Stufe I) auf dem Pi.
# Aktiv (werden beim Start verbunden): psu (Joy-IT Netzteil), mfc (Bronkhorst),
#   dosing_pump (Longer WT600-2J), microgc (Inficon).
# Eingetragen, aber mit `enabled: false` abgeschaltet:
#   demo_gpio_valve (Relais, am 08.10. nicht gebraucht). Solche Geraete werden nicht verbunden,
#   Experimente, die sie benutzen, beim Start mit Warnung uebersprungen.
# Entfernt wurden die Dummy-Geraete, die auf 127.0.0.1 (LABS-DeviceDummys) zeigten, samt ihrer
# Experimente: reagent_valve, electrolysis_loop_valve, pump_valve, purge_pump, fractioncollector.
# Sie stehen weiter in config.dummy.yml.
# Die urspruengliche Windows-Konfiguration (u.a. COM11) liegt unveraendert in config.yml.bak.

listen port: 11123
destination port: 32111
log_level: info
# 13.10.2026 Schrittmodus (docs/vorschlag_schrittmodus_frontend.md): true = nach jedem fertigen Experiment
# anhalten (Paused); der naechste Schritt startet erst mit "Start Experiments", Senden startet nie etwas.
# false = Warteschlange laeuft von selbst durch (Verhalten bis 13.10.). Seit 16.10.2026 EINGESCHALTET
# (Entscheidung Rafael 16.10.); Aenderung wird erst mit dem naechsten Backend-Start wirksam.
step_mode: true

devices:

  psu1:
    driver: joyit_dpm86        # Joy-IT DPM86xx im grauen Kasten "DC SOURCE 48V" (NICHT TDK Lambda wie vorher eingetragen)
    # Der USB-Wandler (CH340) sitzt IM Kasten, kein RS485-Adapter dazwischen. CH340 hat keine Seriennummer,
    # by-id ist deshalb mehrdeutig -> by-path. Der Pfad haengt am USB-Steckplatz: Kasten IMMER in denselben
    # Port stecken. Es gibt DREI solche Kaesten; angeschlossen ist seit 07.10.2026 16:05 ein zweiter
    # (meldet max 60 V / 5 A, Adresse 01, 9600 Baud - gleiches Modell wie der erste) an Hub-Buchse 2.4.2.
    # Vorher (06.10.): erster Kasten an Hub-Buchse 2.1. Aufruf ohne --port zeigt die Pfade:
    #   .venv/bin/python tools/lese_netzteil.py
    # ACHTUNG: Ein Kasten, dessen Wandler am Pi auftaucht, aber nicht antwortet, ist AUSGESCHALTET.
    address: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:2.4.2:1.0-port0
    dpm_address: "01"          # am Geraet bestaetigt
    voltage_limit: 48.0        # Obergrenze fuer Sollwerte in V (laut Labor: Geraet kann 48 V; es meldet selbst max 60 V)
    current_limit: 5.0         # Obergrenze fuer Sollwerte in A (Geraetemaximum, 5-A-Modell). Der Strom pro Versuch
                               # wird als Experimentparameter eingetragen, nicht hier.
    # Alter Dummy-Eintrag (LABS-DeviceDummys): driver: tdk_lambda_zplus, address: 127.0.0.1:12346

  mfc1:
    driver: bronkhorst_mfc
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01B77U-if00-port0
    node: "03"                 # FLOW-BUS-Knotenadresse, ZWEI Hex-Zeichen (Werkseinstellung 3 = "03")
    max_flow_ml_min: 50.0      # Typenschild: 50 mln/min N2. Vom Geraet bestaetigt: Capacity100%
                               # (Prozess 1, Parameter 13) = 50, Capacity unit = "mln/min".
    serial_parameters:
      baudrate: 38400          # am Geraet verifiziert (bei 187500 antwortet es nicht)
  dosing_pump:
    driver: longer_wt600
    # Longer WT600-2J, AM GERAET VERIFIZIERT 06.10.2026: Werkseinstellungen 1200 Baud 8E1, Adresse 1.
    # Start/Stopp/Drehzahl/Lesen ueber den Treiber geprueft. Adapter BG02Q0XU (FTDI, by-id ist eindeutig).
    # Die zweite WT600-2J haengt an Adapter BG01W2OJ, antwortet dort aber nur sporadisch (GND pruefen).
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG02Q0XU-if00-port0
    pump_address: 1           # WT600-Protokolladresse (1-30, ab Werk 1), am Geraet bestaetigt
    tubing: "3.2x6.4"
    tubing_table:              # mL pro Umdrehung je Schlauch (Innen- x Aussendurchmesser in mm)
      3.2x6.4: 0.8883          # Laborangabe: Standardschlauch, 60-600 rpm = 53,3-533 mL/min
    # Alter Dummy-Eintrag (LABS-DeviceDummys): address: 127.0.0.1:12352

  # 27.10.2026 zweite WT600-2J fuer den Anolyten (Rolle im Ablauf noch offen - Rafael sagt spaeter, ob
  # Dauerumwaelzen oder Befuellen, in welchen Schritten, welche Rate). Adapter BG01W2OJ an Hub 2.2.3,
  # Scan 27.10. 13:20: 1200 Baud 8E1, Adresse 1, antwortet stabil (10/10). Meldet "laeuft 60 rpm", obwohl
  # der Kopf steht - echter Start erst mit test_anolyte_speed pruefen.
  anolyte_pump:
    driver: longer_wt600
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01W2OJ-if00-port0
    pump_address: 1
    tubing: "3.2x6.4"          # ANNAHME: gleicher Schlauch wie dosing_pump - beim Einbau pruefen!
    tubing_table:
      3.2x6.4: 0.8883

  liquiline:
    driver: endress_hauser_liquiline
    # 12.10.2026: LAEUFT. Modbus RTU, 19200 Baud, 8E1, Adresse 247, Adapter BG01XFU4 - am Geraet
    # verifiziert (Treiber liest alle drei AI-Bloecke). Der ASCII-Modus des Geraets hat nie
    # geantwortet (30.09.-12.10.); das Geraet steht jetzt im Menue auf RTU, der Treiber spricht RTU.
    # Anschluss: USB-RS485-Adapter BG01XFU4 (FTDI) an Modul 485MB, Klemmen 95 = B (Data+), 96 = A (Data-),
    # 99 = GND. Geraetemenue: Setup/General settings/Extended setup/Modbus: RTU, 19200, Paritaet gerade,
    # Adresse 247, Byte order 1-0-3-2 (ueber Register 506 Watchdog = 5.0 s bestaetigt), Watchdog 5 s.
    # Sensoren am Geraet: CH1 = "1:1 pH Glas"; CH2 = Leitfaehigkeit (seit 13.10.2026, Modbus AI2 meldet mS/cm).
    # Beide zeigen am Display "X --- ---" (kein Messwert) -> Status 2 "Bad", Wert 0.0, bis die
    # Memosens-Sensoren wieder Werte liefern. Protokoll in OFFENE_FRAGEN.md.
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01XFU4-if00-port0
    serial_parameters:
      baudrate: 19200
      parity: E
    bus_address: 247            # Modbus-Busadresse (1-247), Werkseinstellung 247 = am Geraet abgelesen
    byte_order: "1-0-3-2"       # Geraeteparameter "Byte order", Werkseinstellung, am Geraet bestaetigt (s.o.)
    channels:                   # Kanalname: Register (0-basiert = Beginn des AI-Blocks Value/Status/Unit)
      ph_ch1: 0                 # AI1 = CH1 "1:1 pH Glas", Messwert pH       (am Geraet gesetzt 12.10.2026)
      conductivity: 4           # AI2 = CH2, seit 13.10.2026 Leitfaehigkeitssensor (Geraet meldet Einheit mS/cm; vorher "1:2 pH Glas")
      temperature: 8            # AI3 = CH1 "1:1 pH Glas", Messwert Temperatur
    # Dummy-Umgebung (LABS-DeviceDummys): address 127.0.0.1:12353, bus_address 1, siehe config.dummy.yml
    # Ethernet des Geraets (Register 509-513): aktiv, IP 169.254.233.247/24 (Link-Local), kein Gateway.

  microgc:
    driver: inficon_microgc_fusion
    # Echtes Geraet, am 06.10.2026 geprueft: Pi per LAN direkt am microGC. Das Geraet hat KEINEN
    # DHCP-Server, sondern eine Selbstvergabe-Adresse (Link-Local) 169.254.1.1; eth0 des Pi steht
    # deshalb im NetworkManager-Profil "Wired connection 1" auf ipv4.method link-local und
    # ipv4.never-default yes (Standardroute bleibt beim WLAN). Kein Port (80 impliziert).
    # Dummy-Umgebung (LABS-DeviceDummys): 127.0.0.1:12354
    address: 169.254.1.1
    connect_timeout: 5.0        # TCP-Verbindungsaufbau-Timeout in s
    command_parameters:
      timeout: 10.0             # Antwort-Timeout pro Anfrage in s (generischer Mechanismus, s. Treiber)
    # 26.10.2026 drei Zellen an einem GC (docs/gc_rundlauf_3_zellen_26-10-2026.md): Gasstroeme, die der
    # Messplan im Kreis misst (run_schedule_named ... streams: "alle"). Je Strom die Ventilstellungen, die
    # den Gasweg dieser Zelle zum GC oeffnen und die anderen schliessen. flush_s = Spuelzeit nach dem Umschalten.
    flush_s: 30
    switch_after_s: 60       # 27.10.2026 Variante B (Rafael): 60 s nach dem Start eines Laufs schon auf den
                             # naechsten Gasstrom umschalten (Probenahme vorbei, Leitung spuelt waehrend der
                             # 7,6 min Trennung). 0 = wie vorher (erst vor dem Lauf umschalten + flush_s warten).
    streams:
      - { name: Z1, valves: { ventil_z1: B, ventil_z2: A, ventil_z3: A } }
      - { name: Z2, valves: { ventil_z1: A, ventil_z2: B, ventil_z3: A } }
      - { name: Z3, valves: { ventil_z1: A, ventil_z2: A, ventil_z3: B } }
  # 26.10.2026 Drei Zellen parallel: zweites/drittes Netzteil (baugleich, Adresse 01) und zweiter/dritter
  # Bronkhorst. Steckplaetze am 26.10. mit tools/lese_netzteil.py bzw. tools/lese_mfc.py geprueft - NICHT umstecken.
  psu2:
    driver: joyit_dpm86
    address: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:2.1:1.0-port0      # Hub-Buchse 2.1 (26.10.2026) = Kasten mit Etikett "2" (bestaetigt 27.10.)
    dpm_address: "01"
    voltage_limit: 48.0
    current_limit: 5.0
  psu3:
    driver: joyit_dpm86
    address: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:2.2.1:1.0-port0    # Hub-Buchse 2.2.1 (26.10.2026) = Kasten mit Etikett "3" (bestaetigt 27.10.)
    dpm_address: "01"
    voltage_limit: 48.0
    current_limit: 5.0
  mfc2:
    driver: bronkhorst_mfc
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01B1W6-if00-port0   # M18212352C, 50 mln/min N2 = Etikett "2" (bestaetigt 27.10.)
    node: "03"
    max_flow_ml_min: 50.0
    serial_parameters:
      baudrate: 38400
  mfc3:
    driver: bronkhorst_mfc
    address: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG01B8RX-if00-port0   # M18216421B, 20 mln/min N2 (Geraet meldet 20000 uln/min) = Etikett "3" (bestaetigt 27.10.)
    node: "03"
    max_flow_ml_min: 20.0
    serial_parameters:
      baudrate: 38400

  # 26.10.2026 Ventile fuer den GC-Rundlauf: je Zelle ein Relaiskanal, der den Gasweg dieser Zelle zum GC
  # oeffnet (Position B) oder schliesst (A). Hardware "kommt noch" (Rafael 26.10.) - bis dahin simulate: true,
  # damit der Rundlauf im Backend schon laeuft. Beim Verkabeln: simulate entfernen, pin/inverted/safe_state pruefen.
  ventil_z1:
    driver: raspi_gpio_relay_valve
    address: "GPIO17"
    pin: 17                  # ANNAHME, beim Verkabeln pruefen
    inverted: true
    safe_state: "A"            # A = Gasweg Zelle 1 -> GC zu (spannungslos), B = offen (ANNAHME, s. Doku)
    simulate: true             # Ventile noch nicht verkabelt (26.10.2026) - auf dem Pi entfernen, sobald sie dran sind!

  ventil_z2:
    driver: raspi_gpio_relay_valve
    address: "GPIO27"
    pin: 27                  # ANNAHME, beim Verkabeln pruefen
    inverted: true
    safe_state: "A"            # A = Gasweg Zelle 2 -> GC zu (spannungslos), B = offen (ANNAHME, s. Doku)
    simulate: true             # Ventile noch nicht verkabelt (26.10.2026) - auf dem Pi entfernen, sobald sie dran sind!

  ventil_z3:
    driver: raspi_gpio_relay_valve
    address: "GPIO22"
    pin: 22                  # ANNAHME, beim Verkabeln pruefen
    inverted: true
    safe_state: "A"            # A = Gasweg Zelle 3 -> GC zu (spannungslos), B = offen (ANNAHME, s. Doku)
    simulate: true             # Ventile noch nicht verkabelt (26.10.2026) - auf dem Pi entfernen, sobald sie dran sind!

  # 16-Kanal-Relaisplatine (12V) an den GPIO-Pins eines Raspberry Pi, schaltet 3/2-Wege-Haehne.
  # Kein Protokoll, keine Rueckmeldung vom Geraet - ein GPIO-Pin wird nur high/low gesetzt.
  # Ein Geraeteeintrag = ein Relaiskanal = ein GPIO-Pin = ein Ventil (bis zu 16 pro Platine).
  # Treiber: backend/drivers/raspi_gpio_relay_valve.py (Basis: relay_3_2_valve_base.py)
  #
  # KRITISCH - Signalinvertierung (siehe grosser Kommentar im Treiber fuer Details/Quelle):
  #   inverted: true  => .off() schaltet Strom (so verifiziert an dieser Platine)
  #   inverted: false => normale Platine, .on() schaltet Strom
  #   Kein Default - vor dem ersten echten Betrieb gegen die tatsaechliche Platine pruefen!
  #
  # safe_state: Position ("A" oder "B"), die beim Start UND bei jedem stop()/shutdown() angefahren
  # wird. Kein Default - haengt von der Verrohrung/Sicherheit des jeweiligen Ventils ab.
  #
  # simulate: true nutzt gpiozeros Mock-Pinfactory statt echter GPIO-Hardware (fuer Entwicklung
  # ohne Pi, z.B. unter Windows). Fuer den echten Pi weglassen oder auf false setzen - sonst
  # schaltet der Treiber KEIN echtes Relais, auch wenn er sich unauffaellig verhaelt!
  demo_gpio_valve:
    driver: raspi_gpio_relay_valve
    enabled: false       # 07.10.2026: Relaisplatine wird beim Versuch am 08.10. noch nicht gebraucht (nicht verkabelt).
                         # Eintrag bleibt als Vorlage. Zum Aktivieren: enabled auf true, simulate entfernen, Pins pruefen.
    address: "GPIO17"    # frei waehlbar, muss pro Ventil eindeutig sein (hier: Pin als Adresse)
    pin: 17              # BCM-Pinnummer (gpiozero-Zaehlung) - ANNAHME, siehe Treiber-Docstring
    inverted: true        # Platine wie im obigen Kommentar beschrieben
    safe_state: "A"        # Ruheposition (spannungslos) beim Start/Stop
    simulate: true         # Windows-Entwicklung ohne Pi - auf dem Pi entfernen!

#conditions:
  # Once a condition is True it will stay True inside the experiment.
  # Reusing conditions is only problematic when nesting experiments.
  # Strings in arguments and keyword arguments may hold variable parameters that are inserted
  # during the experiments initialization.
#  prerun_condition:
#    [DevicesWaitingCondition, [prerun_condition, [purge_pump]], {}]

experiments:
  # Experimentname:
  #   parameters:
  #     name as used in commands: [ accepted datatype (see below), unit (use "" if no unit) ]
  #     ...
  #   observables:
  #     - [ device, observable name, datatype (e. g. str or float), unit ]
  #     - ...
  #   commands:
  #     - [ device, function, [ args ], { kwargs } ]
  #     - other_experiment_inside_this_one
  #     - ...

  # ---- Netzteil (Joy-IT DPM86xx) ----

  test_psu_output:
    conditions:
    stopconditions:
    parameters:
      current: [float, A]
      max_voltage: [float, V]
    observables:
      - [psu1, current, float, A]
      - [psu1, voltage, float, V]
    commands:
      - [psu1, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}" }]

  stop_psu_output:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [psu1, stop_current, [], {}]

  # 27.10.2026: dieselben Tests fuer Netzteil 2 und 3 (drei baugleiche Kaesten - so findet man heraus,
  # welcher Kasten welche Nummer hat: 2 V / 0 A starten und schauen, welches Display reagiert).
  test_psu2_output:
    conditions:
    stopconditions:
    parameters:
      current: [float, A]
      max_voltage: [float, V]
    observables:
      - [psu2, current, float, A]
      - [psu2, voltage, float, V]
    commands:
      - [psu2, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}" }]

  stop_psu2_output:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [psu2, stop_current, [], {}]

  test_psu3_output:
    conditions:
    stopconditions:
    parameters:
      current: [float, A]
      max_voltage: [float, V]
    observables:
      - [psu3, current, float, A]
      - [psu3, voltage, float, V]
    commands:
      - [psu3, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}" }]

  stop_psu3_output:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [psu3, stop_current, [], {}]

  # ---- MFC (Bronkhorst) ----

  test_mfc_setpoint:
    conditions:
    stopconditions:
    parameters:
      flow: [float, mL/min]
    observables:
      - [mfc1, flow, float, mL/min]
      - [mfc1, counter, float, ""]
    commands:
      - [mfc1, set_setpoint, [], { flow_ml_min: "{flow}" }]
      - [mfc1, measure_flow, [], {}]

  # ===========================================================================================
  # KOLBE-ELEKTROLYSE IM FLOW - Einzelschritte (Versuchsplan 26174-26177, Max Pohl; Werte siehe
  # docs/versuch_08-10-2026_fragen_und_schritte.md). Jeder Schritt wird einzeln im Frontend
  # eingereiht und gestartet; zwischen den Schritten passiert die Handarbeit (Haehne, Proben, pH).
  # Bronkhorst = reiner Gaszaehler, Ventil immer offen (Treiber), kein Setpoint in diesen Schritten.
  # Werte fuer 26174-26177: rate 100 mL/min, current 0.55 A, max_voltage 48 V, minutes 219.
  # ===========================================================================================

  # Schritt 3/10: Pumpe eine feste Zeit laufen lassen (Befuellen/Dichtheitstest, Nachspuelen 10 min).
  # Gaszaehler liest dabei mit (ohne Reset).
  kolbe_pumpe_zeit:
    conditions:
    stopconditions:
    parameters:
      rate: [float, mL/min]
      minutes: [float, min]
    observables:
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
      - [mfc1, flow, float, mL/min]
      - [mfc1, counter, float, mLn]
    commands:
      - [mfc1, start_measuring, [], { interval: 1.0 }]
      - [dosing_pump, run_for_minutes, [], { rate: "{rate}", minutes: "{minutes}" }]

  # Schritt 4: N2-Spuelung vor der Elektrolyse (Plan: 10 min): Zaehler auf 0, Pumpe laeuft,
  # Gasfluss/Zaehler live. Ohne Pumpe -> kolbe_gas_zaehlen benutzen.
  kolbe_n2_spuelung:
    conditions:
    stopconditions:
    parameters:
      rate: [float, mL/min]
      minutes: [float, min]
    observables:
      - [mfc1, flow, float, mL/min]
      - [mfc1, counter, float, mLn]
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
    commands:
      - [mfc1, reset_counter, [], {}]
      - [mfc1, start_measuring, [], { interval: 1.0 }]
      - [dosing_pump, run_for_minutes, [], { rate: "{rate}", minutes: "{minutes}" }]

  # Schritt 5: DIE ELEKTROLYSE. Zaehler auf 0, Pumpe und Netzteil laufen 'minutes' Minuten, dann
  # schaltet das Netzteil selbst ab und die Pumpe stoppt. Alle Werte live (Strom, Spannung,
  # Ladung, Gasfluss, Gasmenge, Drehzahl). Notfall: "Stop Experiments" im Frontend oder
  # Netzschalter am grauen Kasten.
  kolbe_elektrolyse:
    conditions:
    stopconditions:
    parameters:
      current: [float, A]
      max_voltage: [float, V]
      minutes: [float, min]
      rate: [float, mL/min]
    observables:
      - [psu1, current, float, A]
      - [psu1, voltage, float, V]
      - [psu1, amount_of_charge, float, C]
      - [mfc1, flow, float, mL/min]
      - [mfc1, counter, float, mLn]
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
    commands:
      - [mfc1, reset_counter, [], {}]
      - [mfc1, start_measuring, [], { interval: 1.0 }]
      - [dosing_pump, run_for_minutes, [], { rate: "{rate}", minutes: "{minutes}" }]
      - [psu1, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}", minutes: "{minutes}" }]

  # Wie kolbe_elektrolyse, zusaetzlich pH (CH1), Leitfaehigkeit (CH2, seit 13.10.) und Temperatur vom Liquiline alle 2 s.
  # Eigenes Experiment, weil das Frontend neue Observablen nicht in bereits geladene Routinen uebernimmt.
  # Hinweis 12.10.2026: Die Sensoren zeigen am Geraet "X --- ---" -> Status "Bad", Wert 0.0, bis die
  # Memosens-Sensoren wieder Werte liefern; das Experiment laeuft davon unabhaengig weiter.
  kolbe_elektrolyse_ph:
    conditions:
    stopconditions:
    parameters:
      current: [float, A]
      max_voltage: [float, V]
      minutes: [float, min]
      rate: [float, mL/min]
    observables:
      - [psu1, current, float, A]
      - [psu1, voltage, float, V]
      - [psu1, amount_of_charge, float, C]
      - [mfc1, flow, float, mL/min]
      - [mfc1, counter, float, mLn]
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
      - [liquiline, ph_ch1_value, float, pH]
      - [liquiline, conductivity_value, float, mS/cm]
      - [liquiline, temperature_value, float, degC]
      - [liquiline, ph_ch1_status, str, ""]
    commands:
      - [liquiline, start_measuring, [], { interval: 2.0 }]
      - [mfc1, reset_counter, [], {}]
      - [mfc1, start_measuring, [], { interval: 1.0 }]
      - [dosing_pump, run_for_minutes, [], { rate: "{rate}", minutes: "{minutes}" }]
      - [psu1, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}", minutes: "{minutes}" }]

  # 13.10.2026: kolbe_elektrolyse_ph PLUS microGC-Messplan im selben Experiment (statt
  # tools/kolbe_gc_messplan.py im zweiten Terminal). Der microGC startet zu jedem Zeitpunkt in
  # gc_minutes einen benannten Lauf "<versuch>_<t> min" mit Tags Kolbe;MP. gc_minutes: 0 = DAUERMESSUNG
  # (naechster Lauf sobald das Geraet fertig ist, bis `minutes` um sind, ~alle 8 min); Zahl N = alle N
  # Minuten; Liste mit SEMIKOLON "0;10;20;30;40;50;60;80;100;120;140;160;180;200;219" = Versuchsplan. Es
  # werden die Konzentrationen
  # meldet die Konzentrationen (gc_H2, gc_CO2, ... in %) als Observablen -> Kurven/Tabelle im
  # Monitoring, values.json, Bericht. Das Experiment endet erst, wenn der LETZTE GC-Lauf abgeholt ist
  # (letzter Zeitpunkt + ~8 min); Netzteil und Pumpe schalten unabhaengig davon nach `minutes` ab.
  # Neuer Name, weil das Frontend neue Parameter/Observablen nicht in geladene Routinen uebernimmt.
  kolbe_elektrolyse_gc:
    conditions:
    stopconditions:
    parameters:
      versuch: [str, ""]
      gc_minutes: [str, ""]
      current: [float, A]
      max_voltage: [float, V]
      minutes: [float, min]
      rate: [float, mL/min]
    observables:
      - [psu1, current, float, A]
      - [psu1, voltage, float, V]
      - [psu1, amount_of_charge, float, C]
      - [mfc1, flow, float, mL/min]
      - [mfc1, counter, float, mLn]
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
      - [liquiline, ph_ch1_value, float, pH]
      - [liquiline, conductivity_value, float, mS/cm]
      - [liquiline, temperature_value, float, degC]
      - [liquiline, ph_ch1_status, str, ""]
      - [microgc, gc_schedule, str, ""]
      - [microgc, gc_runs_done, int, ""]
      - [microgc, gc_run_name, str, ""]
      - [microgc, gc_H2, float, "%"]
      - [microgc, gc_O2, float, "%"]
      - [microgc, gc_N2, float, "%"]
      - [microgc, gc_CO2, float, "%"]
      - [microgc, gc_Ethylene, float, "%"]
      - [microgc, gc_Ethane, float, "%"]
      - [microgc, gc_1_Penten, float, "%"]
      - [microgc, gc_n_Pentan, float, "%"]
      - [microgc, gc_n_Hexane, float, "%"]
      - [microgc, gc_n_Heptane, float, "%"]
    commands:
      - [liquiline, start_measuring, [], { interval: 2.0 }]
      - [mfc1, reset_counter, [], {}]
      - [mfc1, start_measuring, [], { interval: 1.0 }]
      - [dosing_pump, run_for_minutes, [], { rate: "{rate}", minutes: "{minutes}" }]
      - [psu1, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}", minutes: "{minutes}" }]
      - [microgc, run_schedule_named, [], { method_name: microGC_Standard_Method_calibrated_0726, prefix: "{versuch}", minutes: "{gc_minutes}", until_minutes: "{minutes}", tags: "Kolbe;MP", final_run: true }]

  # Schritt 8: Gas zaehlen ohne Pumpe (N2-Spuelung nach dem Ansaeuern, Plan: bis ~150 mLn).
  # Zaehler auf 0, dann 'minutes' Minuten Fluss/Zaehler live; frueher beenden mit "Stop Experiments".
  kolbe_gas_zaehlen:
    conditions:
    stopconditions:
    parameters:
      minutes: [float, min]
    observables:
      - [mfc1, flow, float, mL/min]
      - [mfc1, counter, float, mLn]
    commands:
      - [mfc1, reset_counter, [], {}]
      - [mfc1, measure_for_minutes, [], { minutes: "{minutes}" }]

  # Schritt 8 mit Umwaelzen (13.10.2026, Wunsch Chemiker): Gas zaehlen, waehrend die Pumpe die
  # Fluessigkeit 'minutes' Minuten mit 'rate' mL/min umwaelzt. Zaehler auf 0, Fluss/Zaehler/Pumpe live,
  # am Ende stoppt die Pumpe. Frueher beenden mit "Stop Experiments". Technisch = kolbe_n2_spuelung,
  # eigener Name, damit der Schritt im Laborplan eindeutig ist. Durchgehender Pumpenlauf ueber mehrere
  # Schritte: docs/vorschlag_pumpe_dauerlauf.md (noch nicht gebaut).
  kolbe_gas_zaehlen_pumpe:
    conditions:
    stopconditions:
    parameters:
