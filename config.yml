# config.yml — dies ist die Datei, die main.py tatsaechlich laedt. Aktuell aktiv ist die
# REDUZIERTE Dummy-Konfiguration (Kopie von config.dummy.yml) zum Testen gegen LABS-DeviceDummys.
# Die urspruengliche Konfiguration mit echter Hardware (u.a. COM11) liegt unveraendert in
# config.yml.bak. Zurueckwechseln: copy config.yml.bak config.yml

listen port: 11123
destination port: 32111
log_level: info

##### Valve positions #####

## reagent_valve ##
# 1: MeOH           Compressability: 6
# 2: MeOH+NH4Cl     Compressability: 6
# 3: Nitrobenzene   Compressability: 6
# 4: DMSO           Compressability: 6
# 5: SE             Compressability: 6
# 6: Reference      Compressability: 6
# 7: Acetonitrile   Compressability: 6

## electrolysis_loop_valve ##
# 1: reservoir
# 2: fraction_collector
# 3: waste
# 4: NMR

## pump_valve ##
# 1: electrolysis_pump
# 2: purge_pump

##### REDUCED CONFIG FOR LABS-DeviceDummys #####
# Only devices that have a simulated counterpart in ..\LABS-DeviceDummys are declared here.
# Not simulated / omitted: reagent_dosing_pump, electrolysis_pump (driver eldex_optos),
# nmr (spinsolve_80), foxy (foxy_r2) - LABS-DeviceDummys ships no dummy module for these.
# Start the dummy server first:
#   cd ..\LABS-DeviceDummys
#   python main.py

devices:

  reagent_valve:
    driver: knauer_azura_vu_4_1
    address: 127.0.0.1:12344

  electrolysis_loop_valve:
    driver: knauer_azura_vu_4_1
    address: 127.0.0.1:12345

  pump_valve:
    driver: knauer_azura_vu_4_1
    address: 127.0.0.1:12344   # shares the dummy instance with reagent_valve

  purge_pump:
    driver: ismatec_reglo_icc
    address: 127.0.0.1:12347
    channel: 4

  psu:
    driver: tdk_lambda_zplus
    address: 127.0.0.1:12346

  fractioncollector:
    driver: omnicoll
    address: 127.0.0.1:12349

  mfc:
    driver: bronkhorst_mfc
    address: 127.0.0.1:12351
    node: "03"                # muss zur Node-Adresse passen, die der Dummy zurueckechot (beliebig, Dummy ist node-agnostisch)
    max_flow_ml_min: 100.0    # Platzhalter, an echtes Geraet anpassen (Typenschild/Kalibrierschein)

  dosing_pump:
    driver: longer_wt600
    address: 127.0.0.1:12352
    pump_address: 1           # WT600-Protokolladresse (1-30, ab Werk 1) - nicht die obige TCP-Adresse
    tubing: "LS16"
    tubing_table:              # mL pro Umdrehung je Schlauch - Platzhalter, per Kalibrierung ermitteln
      LS16: 0.5

  liquiline:
    driver: endress_hauser_liquiline
    address: 127.0.0.1:12353
    bus_address: 1              # Modbus-Busadresse des Geraets (1-247, Werkseinstellung 247) - hier auf 1 gesetzt
    byte_order: "1-0-3-2"       # Geraeteparameter "Byte order", Werkseinstellung - muss zur echten Geraetekonfig passen
    channels:                   # Kanalname: Register (0-basiert, = Beginn des AI-Blocks Value/Status/Unit)
      ph: 0                     # z.B. AI1 am Geraetemenue auf Sensor-1-pH-Messwert gemappt
      conductivity: 4           # AI2
      temperature: 8            # AI3

  microgc:
    driver: inficon_microgc_fusion
    address: 127.0.0.1:12354    # echtes Geraet: feste IP ohne Port (Port 80 impliziert), z.B. 10.10.0.1
    connect_timeout: 5.0        # TCP-Verbindungsaufbau-Timeout in s
    command_parameters:
      timeout: 10.0             # Antwort-Timeout pro Anfrage in s (generischer Mechanismus, s. Treiber)

#conditions:
  # Once a condition is True it will stay True inside the experiment.
  # Reusing conditions is only problematic when nesting experiments.
  # Strings in arguments and keyword arguments may hold variable parameters that are inserted
  # during the experiments initialization.
#  prerun_condition:
#    [DevicesWaitingCondition, [prerun_condition, [purge_pump]], {}]

experiments:
  # Experimentname:
  #   parameters:
  #     name as used in commands: [ accepted datatype (see below), unit (use "" if no unit) ]
  #     ...
  #   observables:
  #     - [ device, observable name, datatype (e. g. str or float), unit ]
  #     - ...
  #   commands:
  #     - [ device, function, [ args ], { kwargs } ]
  #     - other_experiment_inside_this_one
  #     - ...

  # ---- experiments kept from config.yml (only use devices declared above) ----

  empty_valve_reservoir_tube:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [1], {}]
      - [purge_pump, dispense, [], { rate: "15.0", volume: "10.0" }]

  empty_reservoir_filling_tube:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [1], {}]
      - [purge_pump, dispense, [], { rate: "15.0", volume: "20.0" }]

  empty_nmr_cell:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [4], {}]
      - [purge_pump, dispense, [], { rate: "15.0", volume: "25.0" }]

  collect_solution:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [2], {}]
      - [purge_pump, dispense, [], { rate: "-15.0", volume: "55.0" }]

  purge_reservoir_and_temper:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [3], {}]
      - [purge_pump, dispense, [], { rate: "-15.0", volume: "10.0" }]

  next_fraction:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [fractioncollector, next_fraction, [], {}]

  fc_test_1:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [fractioncollector, next_fraction, [], {}]
      - [fractioncollector, next_fraction, [], {}]
      - [fractioncollector, next_fraction, [], {}]

  large_cell_collect_solution:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [purge_pump, remaining_time, int, s]
    commands:
      - [pump_valve, set_position, [2], {}]
      - [electrolysis_loop_valve, set_position, [2], {}]
      - [purge_pump, dispense, [], { rate: "-15.0", volume: "320.0" }]

  # ---- new: exercise the simulated PSU directly (nothing in config.yml used psu without electrolysis_pump) ----

  test_psu_output:
    conditions:
    stopconditions:
    parameters:
      current: [float, A]
      max_voltage: [float, V]
    observables:
      - [psu, current, float, A]
      - [psu, voltage, float, V]
    commands:
      - [psu, output_constant_current, [], { current: "{current}", max_voltage: "{max_voltage}" }]

  stop_psu_output:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [psu, stop_current, [], {}]

  # ---- new: exercise the simulated Bronkhorst MFC directly ----

  test_mfc_setpoint:
    conditions:
    stopconditions:
    parameters:
      flow: [float, mL/min]
    observables:
      - [mfc, flow, float, mL/min]
    commands:
      - [mfc, set_setpoint, [], { flow_ml_min: "{flow}" }]
      - [mfc, measure_flow, [], {}]

  test_mfc_counter:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [mfc, counter, float, ""]
    commands:
      - [mfc, read_counter, [], {}]

  stop_mfc:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [mfc, stop_flow, [], {}]

  # ---- new: exercise the simulated Longer WT600-2J directly ----

  test_wt600_speed:
    conditions:
    stopconditions:
    parameters:
      rpm: [float, rpm]
    observables:
      - [dosing_pump, speed_rpm, int, rpm]
      - [dosing_pump, flow_ml_min, float, mL/min]
    commands:
      - [dosing_pump, set_speed, [], { rpm: "{rpm}" }]
      - [dosing_pump, start_pumping, [], {}]
      - [dosing_pump, read_speed, [], {}]

  stop_wt600:
    conditions:
    stopconditions:
    parameters:
    observables:
    commands:
      - [dosing_pump, stop_pumping, [], {}]

  # ---- new: exercise the simulated Endress+Hauser Liquiline CM44x directly ----

  test_liquiline_ph:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [liquiline, ph_value, float, pH]
      - [liquiline, ph_status, str, ""]
      - [liquiline, ph_unit, str, ""]
    commands:
      - [liquiline, read_channel, [], { channel: "ph" }]

  test_liquiline_all_channels:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [liquiline, ph_value, float, pH]
      - [liquiline, conductivity_value, float, uS/cm]
      - [liquiline, temperature_value, float, degC]
    commands:
      - [liquiline, read_all_channels, [], {}]

  # ---- new: exercise the simulated Inficon Micro GC Fusion directly ----

  test_microgc_status:
    conditions:
    stopconditions:
    parameters:
    observables:
      - [microgc, system, str, ""]
      - [microgc, sequence, str, ""]
    commands:
      - [microgc, get_status, [], {}]

  test_microgc_bakeout:
    conditions:
    stopconditions:
    parameters:
      minutes: [float, min]
    observables:
      - [microgc, system, str, ""]
    commands:
      - [microgc, start_bakeout, [], { minutes: "{minutes}" }]

  test_microgc_run:
    conditions:
    stopconditions:
    parameters:
      method: [str, ""]
    observables:
      - [microgc, system, str, ""]
    commands:
      - [microgc, load_method, [], { method_name: "{method}" }]
      - [microgc, run_method, [], {}]
      - [microgc, get_last_run_data, [], {}]
